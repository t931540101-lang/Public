<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR web service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #ededed;
      color: #333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 1. 頂部導覽列 */
    header {
      background-color: #2b2e33;
      height: 46px;
      display: flex;
      align-items: center;
      position: relative;
      color: #fff;
      z-index: 10;
    }

    /* Logo 圖標位置 */
    .logo-icon {
      position: absolute;
      left: 26.5%;
      width: 18px;
      height: 18px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon::after {
      content: '';
      width: 5px;
      height: 5px;
      border: 1.5px solid #a0a5ad;
      border-radius: 50%;
    }

    /* 選單與語系標籤群組 */
    .nav-group {
      position: absolute;
      left: 37%;
      display: flex;
      align-items: center;
    }

    /* 「首頁」、「請假單」、「未刷單」等距拉開 */
    .nav-links {
      display: flex;
      gap: 130px; /* 大幅拉開首頁、請假單、未刷單之間的距離 */
      align-items: center;
      margin-right: 18px; /* 讓「未刷單」與「TW」保持緊密距離 */
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
    }

    .nav-links a.active {
      color: #ffffff;
    }

    /* 橘色語系按鈕：緊接在「未刷單」右側 */
    .lang-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #f97316;
      color: white;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 2. 主版面區塊 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 中央灰色 Banner (核心區塊) */
    .hero-banner {
      width: 100%;
      height: 260px;
      background-color: #e2e5e8;
      margin-top: 15px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #d0d4d9;
      border-bottom: 1px solid #d0d4d9;
    }

    /* 左上角半透明灰卡片 */
    .bg-card-left {
      position: absolute;
      left: 35px;
      top: -25px;
      width: 170px;
      height: 220px;
      background-color: #d1d5db;
      transform: rotate(-28deg);
      border-radius: 10px;
      opacity: 0.55;
    }

    /* 中央標題文字 */
    .hero-text {
      text-align: center;
      z-index: 2;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 700;
      color: #1a1c1e;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #6b7280;
    }

    /* 右側斜切手機 */
    .phone-mockup {
      position: absolute;
      right: 14%;
      bottom: -45px;
      width: 170px;
      height: 250px;
      background-color: #2b2e33;
      border-radius: 24px 24px 0 0;
      transform: rotate(26deg);
      box-shadow: -6px 8px 18px rgba(0, 0, 0, 0.15);
      padding: 8px 8px 0 8px;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background-color: #4b5258;
      border-radius: 18px 18px 0 0;
    }

    /* 3. Banner 下方區塊與 Footer */
    .bottom-section {
      flex: 1;
      position: relative;
      padding: 30px;
    }

    .copyright {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
      margin-left: 210px;
      margin-top: 15px;
    }

    .toggle-btn {
      position: absolute;
      right: 16px;
      bottom: 16px;
      background-color: #5850ec;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="logo-icon"></div>

    <div class="nav-group">
      <nav class="nav-links">
        <a href="#" class="active">首頁</a>
        <a href="#">請假單</a>
        <a href="#">未刷單</a>
      </nav>
      
      <div class="lang-group">
        <div class="lang-badge">TW</div>
        <div class="lang-badge">TH</div>
        <div class="lang-badge">ID</div>
      </div>
    </div>
  </header>

  <main>
    <!-- 中央 Banner -->
    <div class="hero-banner">
      <div class="bg-card-left"></div>

      <div class="hero-text">
        <h1 class="hero-title">HR web service</h1>
        <p class="hero-subtitle">Designed for IT</p>
      </div>

      <div class="phone-mockup">
        <div class="phone-screen"></div>
      </div>
    </div>

    <!-- 底部與 Footer -->
    <div class="bottom-section">
      <div class="copyright">
        <span>⚙</span>
        <span>© APEX DYNAMICS 2026</span>
      </div>
      <button class="toggle-btn">Toggle theme ▾</button>
    </div>
  </main>

</body>
</html>
