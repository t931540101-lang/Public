<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR web service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #e9ecef;
      color: #333;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* 1. 頂部導覽列 */
    header {
      background-color: #2b2e33;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      color: #fff;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .logo-icon {
      width: 20px;
      height: 20px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon::after {
      content: '';
      width: 6px;
      height: 6px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      gap: 35px;
    }

    .nav-links a {
      color: #b0b5be;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .nav-links a.active {
      color: #ffffff;
    }

    .lang-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #f97316;
      color: white;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 2. 主版面區塊 */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 中央主要的灰色大橫條 Banner (照片中的核心區塊) */
    .hero-banner {
      width: 100%;
      height: 260px;
      background-color: #e2e5e8;
      margin-top: 20px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #d0d4d9;
      border-bottom: 1px solid #d0d4d9;
    }

    /* 左上角半透明灰卡片 */
    .bg-card-left {
      position: absolute;
      left: 25px;
      top: -20px;
      width: 170px;
      height: 220px;
      background-color: #d1d5db;
      transform: rotate(-28deg);
      border-radius: 12px;
      opacity: 0.6;
    }

    /* 中央標題 */
    .hero-text {
      text-align: center;
      z-index: 2;
    }

    .hero-title {
      font-size: 40px;
      font-weight: 700;
      color: #1a1c1e;
      margin-bottom: 8px;
    }

    .hero-subtitle {
      font-size: 15px;
      color: #6b7280;
    }

    /* 右側斜切手機 (底部剛好被 Banner 邊界裁切) */
    .phone-mockup {
      position: absolute;
      right: 12%;
      bottom: -40px;
      width: 170px;
      height: 250px;
      background-color: #2b2e33;
      border-radius: 24px 24px 0 0;
      transform: rotate(26deg);
      box-shadow: -6px 8px 18px rgba(0, 0, 0, 0.15);
      padding: 8px 8px 0 8px;
    }

    .phone-screen {
      width: 100%;
      height: 100%;
      background-color: #4b5258;
      border-radius: 18px 18px 0 0;
    }

    /* 3. Banner 下方區塊與頁尾 */
    .bottom-section {
      flex: 1;
      position: relative;
      padding: 30px;
    }

    .copyright {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
      margin-left: 220px;
      margin-top: 10px;
    }

    .toggle-btn {
      position: absolute;
      right: 16px;
      bottom: 16px;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="nav-left">
      <div class="logo-icon"></div>
      <nav class="nav-links">
        <a href="#" class="active">首頁</a>
        <a href="#">請假單</a>
        <a href="#">未刷單</a>
      </nav>
    </div>
    <div class="lang-group">
      <div class="lang-badge">TW</div>
      <div class="lang-badge">TH</div>
      <div class="lang-badge">ID</div>
    </div>
  </header>

  <main>
    <!-- 中央大 Banner -->
    <div class="hero-banner">
      <div class="bg-card-left"></div>

      <div class="hero-text">
        <h1 class="hero-title">HR web service</h1>
        <p class="hero-subtitle">Designed for IT</p>
      </div>

      <!-- 右側手機，下半部被 Banner 切掉 -->
      <div class="phone-mockup">
        <div class="phone-screen"></div>
      </div>
    </div>

    <!-- 下方空白區塊與 Footer -->
    <div class="bottom-section">
      <div class="copyright">
        <span>⚙</span>
        <span>© APEX DYNAMICS 2026</span>
      </div>
      <button class="toggle-btn">Toggle theme ▾</button>
    </div>
  </main>

</body>
</html>
