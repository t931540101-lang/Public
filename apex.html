<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR web service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ededed;
      color: #333;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 頂部導覽列 */
    header {
      background-color: #2b2e33;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .logo-icon {
      width: 20px;
      height: 20px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon::after {
      content: '';
      width: 6px;
      height: 6px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      gap: 28px;
    }

    .nav-links a {
      color: #b0b5be;
      text-decoration: none;
      font-size: 13px;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #ffffff;
    }

    .lang-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .lang-badge {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background-color: #e65100;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 主內容區 */
    main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 左上角斜區塊 */
    .bg-shape-topleft {
      position: absolute;
      top: -40px;
      left: -60px;
      width: 380px;
      height: 240px;
      background-color: #dbdcde;
      transform: rotate(-22deg);
      border-radius: 8px;
      z-index: 1;
      opacity: 0.7;
    }

    .hero-content {
      text-align: center;
      z-index: 5;
      margin-top: -30px;
    }

    .hero-title {
      font-size: 38px;
      font-weight: 700;
      color: #1a1c1e;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .hero-subtitle {
      font-size: 14px;
      color: #6c757d;
    }

    /* 右下角手機示意圖（等比例大幅縮小） */
    .phone-container {
      position: absolute;
      right: 7%;
      bottom: -45px;
      z-index: 2;
    }

    .phone-mockup {
      width: 150px;
      height: 210px;
      background-color: #2b2f33;
      border-radius: 20px 20px 0 0;
      transform: rotate(26deg);
      box-shadow: -8px 12px 20px rgba(0, 0, 0, 0.12);
      padding: 8px 8px 0 8px;
      display: flex;
      flex-direction: column;
    }

    .phone-screen {
      flex: 1;
      background-color: #484e53;
      border-radius: 14px 14px 0 0;
    }

    /* 頁尾 */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .copyright {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8c939d;
      margin-left: 20%;
      margin-bottom: 25px;
    }

    .toggle-btn {
      pointer-events: auto;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 5px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="nav-left">
      <div class="logo-icon"></div>
      <nav class="nav-links">
        <a href="#" class="active">首頁</a>
        <a href="#">請假單</a>
        <a href="#">未刷單</a>
      </nav>
    </div>
    <div class="lang-group">
      <div class="lang-badge">TW</div>
      <div class="lang-badge">TH</div>
      <div class="lang-badge">ID</div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main>
    <div class="bg-shape-topleft"></div>

    <div class="hero-content">
      <h1 class="hero-title">HR web service</h1>
      <p class="hero-subtitle">Designed for IT</p>
    </div>

    <!-- 右下角手機 -->
    <div class="phone-container">
      <div class="phone-mockup">
        <div class="phone-screen"></div>
      </div>
    </div>

    <!-- 頁尾 -->
    <footer>
      <div class="copyright">
        <span>⚙</span>
        <span>© APEX DYNAMICS 2026</span>
      </div>
      <button class="toggle-btn">Toggle theme ▾</button>
    </footer>
  </main>

</body>
</html>
