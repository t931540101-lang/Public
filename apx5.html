<!DOCTYPE html>
<html lang="zh-TW" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRWebCooperation - 未刷卡單</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #12181f;
      --card-bg: #1a2332;
      --nav-bg: #161e2e;
      --input-bg: #0f1520;
      --border-color: #2a364f;
      --primary-blue: #0d6efd;
    }

    body {
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 頂部導覽列 */
    .navbar-custom {
      background-color: var(--nav-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .lang-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      padding: 0;
      font-size: 0.8rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: justify;
      justify-content: center;
    }

    /* 主區域面板 */
    .main-container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
      flex: 1;
    }

    .form-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .form-control, .form-select {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: #fff;
    }

    .form-control:focus, .form-select:focus {
      background-color: var(--input-bg);
      border-color: var(--primary-blue);
      color: #fff;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }

    /* 示意平版圖片樣式 */
    .tablet-preview {
      border: 12px solid #2d3748;
      border-radius: 20px;
      background: #000;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 15px 30px rgba(0,0,0,0.5);
    }

    /* 頁尾底部固定切換紐 */
    footer {
      border-top: 1px solid var(--border-color);
      color: #6c757d;
      font-size: 0.85rem;
      padding: 1.5rem 0;
    }

    .theme-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-md navbar-dark navbar-custom py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand d-flex align-items-center me-4" href="#">
        <i class="bi bi-gear-wide-connected fs-4 me-2 text-secondary"></i>
      </a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link px-3" href="#">首頁</a>
          </li>
          <li class="nav-item">
            <a class="nav-link px-3" href="#">請假單</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active px-3 fw-bold" href="#">未刷卡</a>
          </li>
        </ul>
        <!-- 語系切換按鈕組 -->
        <div class="d-flex gap-2">
          <button class="btn btn-danger lang-btn">TW</button>
          <button class="btn btn-warning lang-btn text-dark">TH</button>
          <button class="btn btn-danger lang-btn">ID</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主要內容區塊 -->
  <main class="main-container">
    <div class="form-card">
      <div class="row mb-4 align-items-center">
        <div class="col-md-6">
          <button class="btn btn-primary px-4 py-2 fw-bold">
            <i class="bi bi-journal-text me-2"></i>申請記錄
          </button>
        </div>
        <div class="col-md-6 text-md-end text-center mt-3 mt-md-0">
          <h2 class="display-6 fw-bold mb-0">未刷單</h2>
        </div>
      </div>

      <form id="uncardForm" onsubmit="handleFormSubmit(event)">
        <div class="row g-4">
          <!-- 左側輸入區 -->
          <div class="col-md-7">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="empId" class="form-label text-secondary">工號</label>
                <input type="text" class="form-control" id="empId" required autocomplete="off">
              </div>
              <div class="col-md-6">
                <label for="idLastFour" class="form-label text-secondary">身分證後四碼</label>
                <div class="input-group">
                  <input type="password" class="form-control" id="idLastFour" maxlength="4" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePassword()">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                  </button>
                </div>
              </div>
              <div class="col-md-6">
                <label for="reason" class="form-label text-secondary">未刷卡原因</label>
                <select class="form-select" id="reason" required>
                  <option value="未帶卡" selected>未帶卡</option>
                  <option value="忘刷卡">忘刷卡</option>
                  <option value="卡片損壞">卡片損壞</option>
                  <option value="公出公差">公出公差</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="uncardTime" class="form-label text-secondary">未刷卡時間</label>
                <input type="datetime-local" class="form-control" id="uncardTime" required>
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">送出</button>
              </div>
            </div>
          </div>

          <!-- 右側示意區 -->
          <div class="col-md-5 d-flex align-items-center justify-content-center">
            <div class="tablet-preview w-100 me-md-3">
              <div class="text-center text-muted">
                <i class="bi bi-tablet fs-1"></i>
                <p class="small mt-2 mb-0">打卡機/平板連線正常</p>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </main>

  <!-- 頁尾區塊 -->
  <footer class="text-center">
    <div class="container">
      <p class="mb-0">&copy; APEX DYNAMICS 2026</p>
    </div>
  </footer>

  <!-- 右下角 Theme 切換按鈕 -->
  <button class="btn btn-primary theme-toggle-btn rounded-pill px-3 shadow" onclick="toggleTheme()">
    Toggle theme <i class="bi bi-moon-stars ms-1"></i>
  </button>

  <!-- jQuery & Bootstrap 5 JS (與原本頁面的 Bundles 對應) -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // 網頁載入後從 LocalStorage 自動填入草稿
    $(document).ready(function() {
      const savedData = localStorage.getItem('apex_uncard_draft');
      if (savedData) {
        const data = JSON.parse(savedData);
        $('#empId').val(data.empId || '');
        $('#reason').val(data.reason || '未帶卡');
        $('#uncardTime').val(data.uncardTime || '');
      }

      // 自動監聽輸入變更，隨時備份至 LocalStorage (預防關掉瀏覽器資料丟失)
      $('#empId, #reason, #uncardTime').on('input change', function() {
        const draft = {
          empId: $('#empId').val(),
          reason: $('#reason').val(),
          uncardTime: $('#uncardTime').val()
        };
        localStorage.setItem('apex_uncard_draft', JSON.stringify(draft));
      });
    });

    // 密碼顯示/隱藏切換
    function togglePassword() {
      const input = document.getElementById('idLastFour');
      const icon = document.getElementById('eyeIcon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }

    // 主題切換 (Dark / Light)
    function toggleTheme() {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-bs-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-bs-theme', newTheme);
    }

    // 表單送出處理
    function handleFormSubmit(e) {
      e.preventDefault();
      const formData = {
        empId: $('#empId').val(),
        idLastFour: $('#idLastFour').val(),
        reason: $('#reason').val(),
        uncardTime: $('#uncardTime').val(),
        submittedAt: new Date().toISOString()
      };

      console.log('準備送出的表單資料：', formData);
      alert('【測試提示】未刷卡單已成功記錄！\n工號：' + formData.empId + '\n原因：' + formData.reason);
      
      // 送出成功後清除草稿
      localStorage.removeItem('apex_uncard_draft');
    }
  </script>
</body>
</html>
