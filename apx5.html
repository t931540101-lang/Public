<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HRWebCooperation - 未刷卡單</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background-color: #12181f;
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .navbar-custom {
      background-color: #161e2e;
      border-bottom: 1px solid #2a364f;
    }
    .lang-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      padding: 0;
      font-size: 0.75rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .main-box {
      background-color: #1a2332;
      border: 1px solid #2a364f;
      border-radius: 8px;
      padding: 2.5rem;
      margin-top: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .form-control, .form-select {
      background-color: #0f1520;
      border: 1px solid #2a364f;
      color: #fff;
    }
    .form-control:focus, .form-select:focus {
      background-color: #0f1520;
      border-color: #0d6efd;
      color: #fff;
      box-shadow: none;
    }
    .tablet-box {
      border: 12px solid #2d3748;
      border-radius: 16px;
      background: #000;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    footer {
      color: #6c757d;
      font-size: 0.85rem;
      padding: 1.5rem 0;
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
    }
    .theme-toggle-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <nav class="navbar navbar-expand-md navbar-dark navbar-custom py-2">
    <div class="container-fluid px-4">
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link px-3 text-secondary" href="#">首頁</a></li>
          <li class="nav-item"><a class="nav-link px-3 text-secondary" href="#">請假單</a></li>
          <li class="nav-item"><a class="nav-link px-3 active fw-bold text-white" href="#">未刷卡</a></li>
        </ul>
        <!-- 語系切換按鈕 -->
        <div class="d-flex gap-2">
          <button class="btn btn-danger lang-btn">TW</button>
          <button class="btn btn-warning lang-btn text-dark">TH</button>
          <button class="btn btn-danger lang-btn">ID</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- 主要內容區塊 -->
  <div class="container" style="max-width: 1200px;">
    <div class="main-box">
      <div class="row mb-4 align-items-center">
        <div class="col-6">
          <button class="btn btn-primary px-4 py-2 fw-bold">
            <i class="bi bi-journal-text me-2"></i>申請記錄
          </button>
        </div>
        <div class="col-6 text-end">
          <h2 class="display-6 fw-bold mb-0 text-white">未刷單</h2>
        </div>
      </div>

      <form>
        <div class="row g-4">
          <!-- 左側輸入區 -->
          <div class="col-md-7">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-secondary">工號</label>
                <input type="text" class="form-control">
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary">身分證後四碼</label>
                <div class="input-group">
                  <input type="password" class="form-control" maxlength="4">
                  <button class="btn btn-outline-secondary" type="button"><i class="bi bi-eye"></i></button>
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary">未刷卡原因</label>
                <select class="form-select">
                  <option selected>未帶卡</option>
                  <option>忘刷卡</option>
                </select>
              </div>
              <div class="col-md-6">
                <label class="form-label text-secondary">未刷卡時間</label>
                <input type="text" class="form-control" placeholder="年 / 月 / 日 --:--:--">
              </div>
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5">送出</button>
              </div>
            </div>
          </div>

          <!-- 右側平板示意圖 -->
          <div class="col-md-5 d-flex align-items-center justify-content-center">
            <div class="tablet-box w-100">
              <div class="text-center text-muted">
                <i class="bi bi-tablet fs-1 text-secondary"></i>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 頁尾與右下角切換鈕 -->
  <footer>
    &copy; APEX DYNAMICS 2026
  </footer>

  <button class="btn btn-primary theme-toggle-btn rounded-pill px-3 shadow">
    Toggle theme <i class="bi bi-moon-stars ms-1"></i>
  </button>
