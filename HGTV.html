<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HGTV 移動端入口</title>
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-secondary: #666666;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --border-color: #e1e8ed;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        /* 手機窄螢幕外框限制 */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 840px;
            background-color: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        header {
            background-color: var(--primary-color);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .card {
            background: #fafbfc;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .status-msg {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #27ae60;
            text-align: center;
            min-height: 20px;
        }

        footer {
            padding: 15px;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border-color);
            background: #fafbfc;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <header>
            HGTV 行動控制台
        </header>

        <div class="content">
            <div class="section-title">快速狀態與備忘 (自動存檔)</div>
            
            <div class="card">
                <div class="input-group">
                    <label for="userName">使用者暱稱</label>
                    <input type="text" id="userName" placeholder="請輸入小黑哥...">
                </div>
                
                <div class="input-group">
                    <label for="userNote">即時備忘錄</label>
                    <textarea id="userNote" rows="4" placeholder="在此輸入想記錄的內容..."></textarea>
                </div>

                <button class="btn" id="saveBtn">儲存資料</button>
                <div class="status-msg" id="statusMsg"></div>
            </div>

            <div class="section-title">專案資訊</div>
            <div class="card" style="font-size: 0.9rem; color: var(--text-secondary); line-height: 1.5;">
                <p>• 架構：HTML5 響應式手機版</p>
                <p>• 儲存：Web LocalStorage</p>
                <p>• 狀態：運行正常</p>
            </div>
        </div>

        <footer>
            &copy; 2026 HGTV Project. All Rights Reserved.
        </footer>
    </div>

    <script>
        // DOM 元素
        const userNameInput = document.getElementById('userName');
        const userNoteInput = document.getElementById('userNote');
        const saveBtn = document.getElementById('saveBtn');
        const statusMsg = document.getElementById('statusMsg');

        // 1. 頁面載入時，從 LocalStorage 讀取資料
        window.addEventListener('DOMContentLoaded', () => {
            const savedName = localStorage.getItem('hgtv_userName');
            const savedNote = localStorage.getItem('hgtv_userNote');

            if (savedName) userNameInput.value = savedName;
            if (savedNote) userNoteInput.value = savedNote;
        });

        // 2. 點擊按鈕時儲存至 LocalStorage
        saveBtn.addEventListener('click', () => {
            const nameVal = userNameInput.value;
            const noteVal = userNoteInput.value;

            localStorage.setItem('hgtv_userName', nameVal);
            localStorage.setItem('hgtv_userNote', noteVal);

            // 顯示儲存成功提示
            statusMsg.textContent = '資料已成功存入 LocalStorage！';
            setTimeout(() => {
                statusMsg.textContent = '';
            }, 2500);
        });
    </script>
</body>
</html>
