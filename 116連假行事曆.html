<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116年連假行事曆</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #e74c3c;
            --text-color: #333333;
            --muted-color: #7f8c8d;
            --success-color: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; line-height: 1.5; }
        header { text-align: center; margin-bottom: 16px; padding: 8px 0; }
        header h1 { font-size: 1.3rem; color: var(--primary-color); }
        header p { font-size: 0.85rem; color: var(--muted-color); }
        .container { display: flex; flex-direction: column; gap: 12px; max-width: 480px; margin: 0 auto; }
        .card { background: var(--card-bg); border-radius: 10px; padding: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-left: 5px solid var(--primary-color); position: relative; transition: all 0.2s; }
        .card.active { border-left-color: var(--success-color); background-color: #fcfdfd; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .title { font-size: 1.05rem; font-weight: bold; color: var(--primary-color); max-width: 70%; }
        .days-badge { background: var(--accent-color); color: white; padding: 2px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; }
        .date-range { font-size: 0.95rem; font-weight: 600; color: #16a085; margin-bottom: 6px; }
        .desc { font-size: 0.8rem; color: var(--muted-color); border-top: 1px dashed #eee; padding-top: 6px; margin-bottom: 8px; }
        .action-area { display: flex; justify-content: flex-end; }
        .btn-toggle { background: #eee; border: none; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; color: var(--text-color); transition: background 0.2s; }
        .card.active .btn-toggle { background: var(--success-color); color: white; }
    </style>
</head>
<body>

<header>
    <h1>116年政府行政機關連假一覽表</h1>
    <p>💡 點擊「規劃」按鈕可將行程進度儲存於手機中</p>
</header>

<div class="container" id="holiday-list"></div>

<script>
// 116年(2027年) 連假精準數據陣列
const holidays = [
    { id: "h1", name: "中華民國開國紀念日", date: "1/1 (五) ～ 1/3 (日)", days: 3, desc: "精準連放 3 天。" },
    { id: "h2", name: "除夕及春節", date: "2/4 (四) ～ 2/10 (三)", days: 7, desc: "農曆初一(2/6)及初二(2/7)逢例假日，於2/9(二)及2/10(三)補假。" },
    { id: "h3", name: "和平紀念日", date: "2/27 (六) ～ 3/1 (一)", days: 3, desc: "和平紀念日(2/28)適逢星期日，於3/1(一)補假。" },
    { id: "h4", name: "兒童節及清明節", date: "4/3 (六) ～ 4/6 (二)", days: 4, desc: "兒童節(4/4)適逢星期日，於清明節(4/5)之次日4/6(二)補假。" },
    { id: "h5", name: "勞動節", date: "4/30 (五) ～ 5/2 (日)", days: 3, desc: "勞動節(5/1)適逢星期六，於4/30(五)補假。" },
    { id: "h6", name: "國慶日", date: "10/9 (六) ～ 10/11 (一)", days: 3, desc: "國慶日(10/10)適逢星期日，於10/11(一)補假。" },
    { id: "h7", name: "臺灣光復暨金門古寧頭大捷紀念日", date: "10/23 (六) ～ 10/25 (一)", days: 3, desc: "歷史紀念日連假 3 天。" },
    { id: "h8", name: "行憲紀念日", date: "12/24 (五) ～ 12/26 (日)", days: 3, desc: "行憲紀念日(12/25)適逢星期六，於12/24(五)補假。" },
    { id: "h9", name: "117年中華民國開國紀念日", date: "116/12/31 (五) ～ 117/1/2 (日)", days: 3, desc: "117年開國紀念日(1/1)適逢星期六，於116/12/31(五)補假。" }
];

// 讀取 Local Storage 狀態
let savedStatus = JSON.parse(localStorage.getItem('小黑哥連假規劃')) || {};

const listContainer = document.getElementById('holiday-list');

// 動態渲染卡片
function renderCards() {
    listContainer.innerHTML = holidays.map(h => {
        const isPlan = savedStatus[h.id] ? 'active' : '';
        const btnText = savedStatus[h.id] ? '✓ 已規劃' : '＋ 標記規劃';
        return `
            <div class="card ${isPlan}" id="card-${h.id}">
                <div class="card-header">
                    <div class="title">${h.name}</div>
                    <span class="days-badge">${h.days}天</span>
                </div>
                <div class="date-range">${h.date}</div>
                ${h.desc ? `<div class="desc">${h.desc}</div>` : ''}
                <div class="action-area">
                    <button class="btn-toggle" onclick="togglePlan('${h.id}')">${btnText}</button>
                </div>
            </div>
        `;
    }).join('');
}

// 切換規劃狀態並存入 Local Storage
window.togglePlan = function(id) {
    savedStatus[id] = !savedStatus[id];
    // 移除為 false 的項目，保持資料乾淨
    if (!savedStatus[id]) delete savedStatus[id];
    
    localStorage.setItem('小黑哥連假規劃', JSON.stringify(savedStatus));
    
    // 即時更新 UI
    const card = document.getElementById(`card-${id}`);
    const btn = card.querySelector('.btn-toggle');
    if (savedStatus[id]) {
        card.classList.add('active');
        btn.textContent = '✓ 已規劃';
    } else {
        card.classList.remove('active');
        btn.textContent = '＋ 標記規劃';
    }
}

// 初始啟動
renderCards();
</script>

</body>
</html>
