<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑曜石通訊 - 指揮中心</title>
    <style>
        :root {
            --bg-color: #f7f8fa;
            --card-bg: #ffffff;
            --primary: #06c755;
            --primary-light: #e8f8f0;
            --text-main: #111111;
            --text-sub: #888888;
            --border-color: #f0f0f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: #111827;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-main);
        }

        /* 手機外框容器 */
        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100%;
            max-height: 896px;
            background-color: var(--card-bg);
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        @media (min-width: 415px) {
            .phone-container {
                height: 85vh;
                border-radius: 36px;
                border: 8px solid #1f2937;
            }
        }

        /* 內容切換頁面 */
        .page-content {
            flex: 1;
            overflow-y: auto;
            display: none;
            background-color: var(--card-bg);
            padding-bottom: 20px;
        }

        .page-content.active {
            display: flex;
            flex-direction: column;
        }

        /* 主頁樣式 */
        .home-header {
            padding: 16px 20px 8px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .home-top-icons {
            display: flex;
            gap: 16px;
            font-size: 18px;
            color: var(--text-main);
            margin-left: auto;
        }

        .home-top-icons span {
            cursor: pointer;
        }

        .profile-section {
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .profile-left h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .profile-status {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 8px;
            cursor: pointer;
        }

        /* 音樂標籤區 (可點擊播放/設定) */
        .profile-music-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .profile-music {
            display: inline-flex;
            align-items: center;
            background: var(--bg-color);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            color: var(--text-main);
            gap: 6px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .profile-music:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .music-settings-btn {
            background: var(--bg-color);
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-sub);
        }

        .music-settings-btn:hover {
            background: #e5e7eb;
            color: var(--text-main);
        }

        .profile-avatar-group {
            position: relative;
            width: 70px;
            height: 70px;
            flex-shrink: 0;
        }

        .main-avatar {
            width: 60px;
            height: 60px;
            background: #d1d5db;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: absolute;
            bottom: 0;
            left: 0;
            border: 2px solid white;
        }

        .sub-avatar {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            position: absolute;
            top: 0;
            right: 0;
            border: 2px solid white;
            font-weight: bold;
        }

        /* 搜尋列 */
        .search-container {
            padding: 0 20px 16px 20px;
        }

        .search-box {
            background-color: var(--bg-color);
            border-radius: 20px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-sub);
            font-size: 14px;
        }

        .search-box input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 14px;
            color: var(--text-main);
        }

        .section-divider {
            height: 6px;
            background-color: var(--bg-color);
            width: 100%;
        }

        /* 清單群組 */
        .list-section {
            padding: 16px 20px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-title {
            font-size: 16px;
            font-weight: 700;
        }

        .list-more {
            font-size: 13px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .list-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .list-item-avatar {
            width: 44px;
            height: 44px;
            background: #e5e7eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-sub);
            font-size: 16px;
        }

        .list-item-info {
            flex: 1;
        }

        .list-item-name {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .list-item-desc {
            font-size: 13px;
            color: var(--text-sub);
        }

        .list-item-count {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* 服務網格 */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            text-align: center;
            padding: 4px 0;
        }

        .service-icon-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .service-icon {
            width: 44px;
            height: 44px;
            background: var(--bg-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .service-name {
            font-size: 11px;
            color: var(--text-main);
        }

        /* 聊天分頁樣式 */
        .chat-list-header {
            padding: 16px 20px;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .chat-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .chat-item:hover {
            background-color: var(--bg-color);
        }

        .chat-avatar {
            width: 48px;
            height: 48px;
            background: var(--primary);
            border-radius: 50%;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-name-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .chat-name {
            font-size: 15px;
            font-weight: 600;
        }

        .chat-time {
            font-size: 11px;
            color: var(--text-sub);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 獨立聊天室視窗 */
        #chat-room-pane {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-color);
            display: none;
            flex-direction: column;
            z-index: 50;
        }

        .chatroom-top {
            background: var(--card-bg);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            font-size: 16px;
        }

        .chatroom-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.4;
            word-break: break-all;
        }

        .msg-bubble.user {
            background-color: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg-bubble.bot {
            background-color: var(--card-bg);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .chatroom-input {
            background: var(--card-bg);
            padding: 10px 16px;
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border-color);
        }

        .chatroom-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        .chatroom-input button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0 16px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }

        /* 底部 LINE 風格導覽列 */
        nav.tab-bar {
            height: 65px;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 4px;
        }

        .tab-item {
            flex: 1;
            text-align: center;
            font-size: 11px;
            color: var(--text-sub);
            cursor: pointer;
        }

        .tab-item.active {
            color: var(--primary);
            font-weight: 600;
        }

        .tab-item .icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-container">

        <!-- 隱藏的音樂播放物件 -->
        <audio id="bgMusic" loop></audio>

        <!-- 1. 主頁分頁 -->
        <div id="page-home" class="page-content active">
            <div class="home-header">
                <div class="home-top-icons">
                    <span>📑</span>
                    <span>🔔</span>
                    <span>➕</span>
                    <span>⚙️</span>
                </div>
            </div>

            <div class="profile-section">
                <div class="profile-left">
                    <h1 id="displayName">慶</h1>
                    <div class="profile-status" id="displayStatus" onclick="editStatus()">輸入狀態消息</div>
                    
                    <!-- 音樂標籤與設定按鈕 -->
                    <div class="profile-music-wrapper">
                        <div class="profile-music" id="musicBar" onclick="togglePlayMusic()" title="點擊播放/暫停音樂">
                            <span id="musicIcon">🎵</span>
                            <span id="musicTitleText">黑曜石計畫 - 核心運行中</span>
                        </div>
                        <button class="music-settings-btn" onclick="configureMusic()" title="設定音樂連結">⚙️</button>
                    </div>
                </div>
                <div class="profile-avatar-group">
                    <div class="main-avatar">👨‍💻</div>
                    <div class="sub-avatar">柔</div>
                </div>
            </div>

            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="搜尋好友、群組、黑曜石筆記...">
                </div>
            </div>

            <div class="section-divider"></div>

            <!-- 好友名單區 -->
            <div class="list-section">
                <div class="list-header">
                    <div class="list-title">好友名單</div>
                    <div class="list-more">顯示全部</div>
                </div>

                <div class="list-item">
                    <div class="list-item-avatar" style="background: var(--primary-light); color: var(--primary);">⭐</div>
                    <div class="list-item-info">
                        <div class="list-item-name">我的最愛</div>
                        <div class="list-item-desc">黑曜石架構團隊</div>
                    </div>
                    <div class="list-item-count">1 &gt;</div>
                </div>

                <div class="list-item">
                    <div class="list-item-avatar">👥</div>
                    <div class="list-item-info">
                        <div class="list-item-name">好友</div>
                        <div class="list-item-desc">專屬夥伴與聯絡人</div>
                    </div>
                    <div class="list-item-count">3 &gt;</div>
                </div>

                <div class="list-item">
                    <div class="list-item-avatar">🏛️</div>
                    <div class="list-item-info">
                        <div class="list-item-name">群組</div>
                        <div class="list-item-desc">黑曜石計畫開發群</div>
                    </div>
                    <div class="list-item-count">1 &gt;</div>
                </div>
            </div>

            <div class="section-divider"></div>

            <!-- 服務區 -->
            <div class="list-section">
                <div class="list-header">
                    <div class="list-title">服務</div>
                    <div class="list-more">顯示全部</div>
                </div>

                <div class="services-grid">
                    <div class="service-icon-box">
                        <div class="service-icon">🎨</div>
                        <div class="service-name">貼圖小鋪</div>
                    </div>
                    <div class="service-icon-box">
                        <div class="service-icon">💡</div>
                        <div class="service-name">靈感小鋪</div>
                    </div>
                    <div class="service-icon-box">
                        <div class="service-icon">🛠️</div>
                        <div class="service-name">工具捷徑</div>
                    </div>
                    <div class="service-icon-box">
                        <div class="service-icon">☁️</div>
                        <div class="service-name">雲端同步</div>
                    </div>
                    <div class="service-icon-box">
                        <div class="service-icon">📌</div>
                        <div class="service-name">備忘錄</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 2. 聊天分頁 -->
        <div id="page-chat" class="page-content">
            <div class="chat-list-header">
                <span>聊天</span>
                <span style="font-size: 16px; cursor: pointer;">➕</span>
            </div>
            <div class="chat-item" onclick="openChatRoom()">
                <div class="chat-avatar">柔</div>
                <div class="chat-info">
                    <div class="chat-name-row">
                        <span class="chat-name">柔 (專屬夥伴)</span>
                        <span class="chat-time">上午 09:47</span>
                    </div>
                    <div class="chat-preview" id="lastMsgPreview">嗨，小黑哥！這個音樂區塊隨時可以點擊切換播放或設定你喜歡的音樂連結！</div>
                </div>
            </div>
        </div>

        <!-- 3. 其他分頁預留 -->
        <div id="page-explore" class="page-content" style="align-items: center; justify-content: center; color: var(--text-sub);">
            <p>精簡版：無廣告逛逛專區</p>
        </div>
        <div id="page-today" class="page-content" style="align-items: center; justify-content: center; color: var(--text-sub);">
            <p>精簡版：TODAY 記事</p>
        </div>
        <div id="page-wallet" class="page-content" style="align-items: center; justify-content: center; color: var(--text-sub);">
            <p>精簡版：憑證與數據錢包</p>
        </div>

        <!-- 獨立聊天室視窗 -->
        <div id="chat-room-pane">
            <div class="chatroom-top">
                <span style="cursor: pointer;" onclick="closeChatRoom()">❮</span>
                <span>柔 (專屬夥伴)</span>
            </div>
            <div class="chatroom-messages" id="chatMessagesBox"></div>
            <div class="chatroom-input">
                <input type="text" id="chatInputText" placeholder="輸入訊息..." onkeypress="handleEnterKey(event)">
                <button onclick="sendMsg()">傳送</button>
            </div>
        </div>

        <!-- 底部 LINE 風格導覽列 -->
        <nav class="tab-bar">
            <div class="tab-item active" onclick="switchTab('home', this)">
                <div class="icon">🏠</div>
                主頁
            </div>
            <div class="tab-item" onclick="switchTab('chat', this)">
                <div class="icon">💬</div>
                聊天
            </div>
            <div class="tab-item" onclick="switchTab('explore', this)">
                <div class="icon">🛍️</div>
                逛逛
            </div>
            <div class="tab-item" onclick="switchTab('today', this)">
                <div class="icon">📰</div>
                TODAY
            </div>
            <div class="tab-item" onclick="switchTab('wallet', this)">
                <div class="icon">👛</div>
                錢包
            </div>
        </nav>
    </div>

    <script>
        // 資料初始化與 LocalStorage 存檔
        let statusText = localStorage.getItem('obsidian_user_status') || '輸入狀態消息';
        document.getElementById('displayStatus').innerText = statusText;

        let musicName = localStorage.getItem('obsidian_music_name') || '黑曜石計畫 - 核心運行中';
        let musicUrl = localStorage.getItem('obsidian_music_url') || '';
        document.getElementById('musicTitleText').innerText = musicName;

        const bgMusic = document.getElementById('bgMusic');
        if (musicUrl) bgMusic.src = musicUrl;

        let isPlaying = false;

        // 編輯狀態訊息
        function editStatus() {
            const newStatus = prompt('請輸入新的狀態訊息：', statusText);
            if (newStatus !== null) {
                statusText = newStatus.trim() || '輸入狀態消息';
                document.getElementById('displayStatus').innerText = statusText;
                localStorage.setItem('obsidian_user_status', statusText);
            }
        }

        // 設定音樂 (名稱與外部音訊連結)
        function configureMusic() {
            const name = prompt('請輸入音樂顯示名稱：', musicName);
            if (name === null) return;
            const url = prompt('請輸入音樂檔案的外部連結 (建議為直連 MP3 網址)：', musicUrl);
            if (url === null) return;

            musicName = name.trim() || '黑曜石計畫 - 核心運行中';
            musicUrl = url.trim();

            document.getElementById('musicTitleText').innerText = musicName;
            localStorage.setItem('obsidian_music_name', musicName);
            localStorage.setItem('obsidian_music_url', musicUrl);

            if (musicUrl) {
                bgMusic.src = musicUrl;
                bgMusic.load();
                alert('音樂設定已儲存！點擊音樂條即可開始播放。');
            }
        }

        // 播放 / 暫停音樂
        function togglePlayMusic() {
            if (!musicUrl) {
                alert('請先點擊旁邊的齒輪 (⚙️) 設定音樂的外部連結喔！');
                configureMusic();
                return;
            }

            if (isPlaying) {
                bgMusic.pause();
                isPlaying = false;
                document.getElementById('musicIcon').innerText = '🎵';
                document.getElementById('musicBar').style.background = 'var(--bg-color)';
            } else {
                bgMusic.play().then(() => {
                    isPlaying = true;
                    document.getElementById('musicIcon').innerText = '⏸️';
                    document.getElementById('musicBar').style.background = 'var(--primary-light)';
                }).catch(err => {
                    alert('播放失敗，請確認音樂連結是否有效（部分瀏覽器需要直接支援音訊串流或需與網頁同源）。');
                });
            }
        }

        // 分頁切換
        function switchTab(pageId, element) {
            document.querySelectorAll('.page-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            document.getElementById(`page-${pageId}`).classList.add('active');
        }

        // 開啟/關閉聊天室
        let messages = JSON.parse(localStorage.getItem('obsidian_chat_data')) || [
            { sender: 'bot', text: '嗨，小黑哥！這個音樂區塊隨時可以點擊切換播放或設定你喜歡的音樂連結！' }
        ];

        function openChatRoom() {
            document.getElementById('chat-room-pane').style.display = 'flex';
            renderChat();
        }

        function closeChatRoom() {
            document.getElementById('chat-room-pane').style.display = 'none';
        }

        function renderChat() {
            const box = document.getElementById('chatMessagesBox');
            box.innerHTML = '';
            messages.forEach(m => {
                const div = document.createElement('div');
                div.className = `msg-bubble ${m.sender}`;
                div.innerText = m.text;
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        }

        function sendMsg() {
            const input = document.getElementById('chatInputText');
            const txt = input.value.trim();
            if (!txt) return;

            messages.push({ sender: 'user', text: txt });
            input.value = '';
            renderChat();
            updatePreview(txt);
            saveChat();

            setTimeout(() => {
                messages.push({ sender: 'bot', text: `收到：「${txt}」。音樂隨時伴隨我們的黑曜石計畫！` });
                renderChat();
                updatePreview(`收到：「${txt}」`);
                saveChat();
            }, 600);
        }

        function handleEnterKey(e) {
            if (e.key === 'Enter') sendMsg();
        }

        function updatePreview(txt) {
            document.getElementById('lastMsgPreview').innerText = txt;
        }

        function saveChat() {
            localStorage.setItem('obsidian_chat_data', JSON.stringify(messages));
        }
    </script>
</body>
