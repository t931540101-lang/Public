<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑曜石計畫 - 好友名單</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --accent-hover: #9955eb;
            --danger-color: #cf6679;
            --border-color: #2c2c2c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }

        .phone-container {
            width: 100%;
            max-width: 400px;
            height: 85vh;
            max-height: 750px;
            background-color: var(--card-bg);
            border-radius: 30px;
            border: 4px solid #333;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .header {
            padding: 20px;
            background-color: #181818;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .header h1 {
            font-size: 1.2rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }

        .header p {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .input-section {
            padding: 15px;
            background-color: #161616;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input, select {
            flex: 1;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #252525;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        button {
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent-color);
            color: #121212;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .list-section {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .friend-card {
            background-color: #252525;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--accent-color);
            animation: fadeIn 0.3s ease;
        }

        .friend-info h3 {
            font-size: 0.95rem;
            margin-bottom: 2px;
        }

        .friend-info p {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .delete-btn {
            background: transparent;
            color: var(--danger-color);
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 5px;
        }

        .delete-btn:hover {
            color: #ff8093;
        }

        .empty-state {
            text-align: center;
            color: var(--text-secondary);
            margin-top: 40px;
            font-size: 0.85rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <h1>黑曜石計畫 🛡️ 好友名單</h1>
            <p>Local Storage 狀態同步中</p>
        </div>

        <div class="input-section">
            <div class="input-row">
                <input type="text" id="friendName" placeholder="好友暱稱 / 代號" autocomplete="off">
                <select id="friendGroup">
                    <option value="核心戰友">核心戰友</option>
                    <option value="技術交流">技術交流</option>
                    <option value="日常夥伴">日常夥伴</option>
                </select>
            </div>
            <div class="input-row">
                <input type="text" id="friendNote" placeholder="備註（例：專精架構/除錯）" autocomplete="off">
                <button onclick="addFriend()">新增</button>
            </div>
        </div>

        <div class="list-section" id="friendList">
            <!-- 動態載入好友清單 -->
        </div>
    </div>

    <script>
        // 初始化載入 LocalStorage 資料
        let friends = JSON.parse(localStorage.getItem('obsidian_friends')) || [];

        function renderFriends() {
            const listContainer = document.getElementById('friendList');
            listContainer.innerHTML = '';

            if (friends.length === 0) {
                listContainer.innerHTML = `<div class="empty-state">目前還沒有記錄任何好友，趕快把夥伴加入陣營吧！</div>`;
                return;
            }

            friends.forEach((friend, index) => {
                const card = document.createElement('div');
                card.className = 'friend-card';
                card.innerHTML = `
                    <div class="friend-info">
                        <h3>${escapeHtml(friend.name)} <span style="font-size: 0.7rem; color: var(--accent-color);">[${escapeHtml(friend.group)}]</span></h3>
                        <p>${escapeHtml(friend.note || '無特別備註')}</p>
                    </div>
                    <button class="delete-btn" onclick="removeFriend(${index})" title="刪除">✕</button>
                `;
                listContainer.appendChild(card);
            });
        }

        function addFriend() {
            const nameInput = document.getElementById('friendName');
            const groupInput = document.getElementById('friendGroup');
            const noteInput = document.getElementById('friendNote');

            const name = nameInput.value.trim();
            const group = groupInput.value;
            const note = noteInput.value.trim();

            if (!name) {
                alert('夥伴，名字總得填一個吧！');
                return;
            }

            friends.push({ name, group, note });
            saveAndRender();

            // 清空輸入框
            nameInput.value = '';
            noteInput.value = '';
            nameInput.focus();
        }

        function removeFriend(index) {
            friends.splice(index, 1);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('obsidian_friends', JSON.stringify(friends));
            renderFriends();
        }

        // 防止 XSS 攻擊的小工具
        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 頁面載入時渲染
        renderFriends();
    </script>
</body>
</html>
