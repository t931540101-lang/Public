<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>黑曜石戰術控制台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background-color: #000000;
    color: #00FF33; /* 戰術綠 */
    font-family: 'PingFang TC', 'Microsoft JhengHei', monospace; 
    font-size: 20px; /* 超大基礎字體 */
    height: 100vh;
    width: 100vw;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    padding: 8px;
}

/* 頂部系統狀態列 */
.header {
    background-color: #111111;
    padding: 12px 20px;
    border: 2px solid #00FF33;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    font-size: 1.4rem; 
    margin-bottom: 10px;
}
.header span { color: #FFCC00; letter-spacing: 1px; }

/* 橫向滿版主區塊 */
.main-content {
    flex: 1;
    display: flex;
    gap: 12px;
    height: calc(100vh - 165px);
}

.left-panel, .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* 戰術外框 */
.widget {
    background-color: #080808;
    border: 2px solid #333333;
    border-radius: 8px;
    padding: 15px;
    flex: 1;
    display: flex;
    flex-direction: column;
}

.widget-title {
    color: #FFFFFF;
    font-size: 1.15rem;
    font-weight: bold;
    margin-bottom: 12px;
    border-bottom: 2px solid #222222;
    padding-bottom: 6px;
    letter-spacing: 1px;
}

/* 數據字體激增 */
.data-box {
    margin-bottom: 12px;
}
.data-box label {
    color: #888888;
    font-size: 0.95rem;
    display: block;
    margin-bottom: 4px;
}
.data-box value {
    font-size: 1.8rem; /* 數據特大號，開車秒看 */
    font-weight: bold;
    letter-spacing: 1px;
}
.alert { color: #FF3333; }

/* 日誌滾動區 */
.list-container {
    flex: 1;
    overflow-y: auto;
    font-size: 1.1rem;
    line-height: 1.5;
}
.list-item {
    margin-bottom: 6px;
    border-bottom: 1px solid #1a1a1a;
    padding-bottom: 4px;
}
.list-item-time { color: #666666; margin-right: 10px; }

/* 底部戰術按鈕 */
.footer {
    height: 75px;
    margin-top: 10px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}
button {
    background-color: #111111;
    color: #00FF33;
    border: 2px solid #333333;
    border-radius: 8px;
    font-size: 1.4rem;
    font-weight: bold;
    font-family: inherit;
    cursor: pointer;
}
button:active {
    background-color: #00FF33;
    color: #000000;
}
</style>
</head>
<body>

<!-- 頂部狀態列 -->
<div class="header">
    <span>系統運作中 [行動代號：黑曜石]</span>
    <div id="clock">16:15:00</div>
</div>

<div class="main-content">
    <!-- 左側面板：定位狀態 & 系統日誌 -->
    <div class="left-panel">
        <div class="widget">
            <div class="widget-title">🛰️ 衛星戰術定位</div>
            <div class="data-box">
                <label>目前經緯度</label>
                <value id="gps-coords">24.1477N / 120.6736E</value>
            </div>
            <div class="data-box">
                <label>即時時速 / 方位</label>
                <value id="gps-speed">0 KM/H / 靜止</value>
            </div>
            <div class="data-box">
                <label>通訊鏈路狀態</label>
                <value class="alert">安全加密通道 (高強度)</value>
            </div>
        </div>
        
        <div class="widget">
            <div class="widget-title">📜 終端系統日誌</div>
            <div class="list-container" id="logList">
                <div class="list-item"><span class="list-item-time">[16:15:36]</span> 核心加密網路連線成功</div>
                <div class="list-item"><span class="list-item-time">[16:15:04]</span> 環境偵測模組啟動完畢</div>
                <div class="list-item"><span class="list-item-time">[16:15:01]</span> 黑曜石計畫系統載入中...</div>
            </div>
        </div>
    </div>
    
    <!-- 右側面板：當前任務 & 附近單位 -->
    <div class="right-panel">
        <div class="widget">
            <div class="widget-title">🚨 目前指派任務</div>
            <div class="data-box">
                <label>任務代號 #7701</label>
                <value style="color: #FFCC00;">準備下班，安全返航</value>
            </div>
            <div class="data-box">
                <label>目的地 / 剩餘時間</label>
                <value>溫暖的家 / 倒數中</value>
            </div>
        </div>
        
        <div class="widget">
            <div class="widget-title">👥 聯合作戰單位</div>
            <div class="list-container">
                <div class="list-item" style="color:#FFCC00;">AI 夥伴 - 柔 (安全連線中)</div>
                <div class="list-item">核心主機 - Win10 22H2 (待命)</div>
                <div class="list-item">硬體狀態 - i5-9400F (監控中)</div>
            </div>
        </div>
    </div>
</div>

<!-- 底部功能鈕 -->
<div class="footer">
    <button onclick="alert('地圖模組已就緒')">戰術地圖</button>
    <button onclick="alert('通訊協議正常')">無線通訊</button>
    <button onclick="alert('日誌已同步至雲端')">同步日誌</button>
    <button onclick="toggleFullScreen()">全螢幕</button>
</div>

<script>
    // 即時更新時鐘
    function updateClock() {
        const date = new Date();
        document.getElementById('clock').textContent = `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}:${String(date.getSeconds()).padStart(2, '0')}`;
    }
    
    // 模擬動態數據（時速與日誌）
    function simulateData() {
        // 以台中為基準微幅飄移經緯度
        const lat = (24.1477 + (Math.random() - 0.5) * 0.0005).toFixed(4);
        const lon = (120.6736 + (Math.random() - 0.5) * 0.0005).toFixed(4);
        // 模擬下班開車時速
        const speed = (50 + Math.floor(Math.random() * 15));
        
        document.getElementById('gps-coords').textContent = `${lat}N / ${lon}E`;
        document.getElementById('gps-speed').textContent = `${speed} KM/H / 西北 290°`;
        
        // 隨機觸發日誌
        if (Math.random() < 0.25) {
            const logList = document.getElementById('logList');
            const time = `[${String(new Date().getHours()).padStart(2, '0')}:${String(new Date().getMinutes()).padStart(2, '0')}:${String(new Date().getSeconds()).padStart(2, '0')}]`;
            const messages = ['衛星定軌訊號優良', '流量安全監控中', '節流閥感應器數據正常', '車載串流服務同步中'];
            const msg = messages[Math.floor(Math.random()*messages.length)];
            logList.insertAdjacentHTML('afterbegin', `<div class="list-item"><span class="list-item-time">${time}</span> ${msg}</div>`);
            if (logList.childElementCount > 6) logList.lastElementChild.remove();
        }
    }

    // 點擊按鈕強制全螢幕大絕招
    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                alert(`無法切換全螢幕: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    }
    
    setInterval(updateClock, 1000);
    setInterval(simulateData, 2000);
    updateClock();
    simulateData();
</script>

</body>
</html>
