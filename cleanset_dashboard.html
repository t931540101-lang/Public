<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITE HAT // DEFENDER REAL-TIME ACTIVE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace, 'PingFang TC';
            background-color: #03070c;
            color: #00ffaa;
            padding: 15px;
            overflow-x: hidden;
        }
        .header {
            border: 1px solid #00d2ff;
            background: rgba(0, 20, 35, 0.8);
            padding: 12px;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title-group { text-align: left; }
        .title {
            font-size: 22px;
            font-weight: bold;
            color: #00d2ff;
            letter-spacing: 3px;
            text-shadow: 0 0 8px #00d2ff;
        }
        .fs-btn {
            background: transparent;
            border: 1px dashed #00d2ff;
            color: #00d2ff;
            padding: 6px 12px;
            font-size: 11px;
            font-family: monospace;
            cursor: pointer;
            border-radius: 3px;
        }
        .fs-btn:hover { background: #00d2ff; color: #03070c; box-shadow: 0 0 8px #00d2ff; }
        .module {
            background: rgba(8, 16, 28, 0.85);
            border: 1px solid #162d4a;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .mod-title {
            font-size: 11px;
            color: #829ab1;
            margin-bottom: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            border-left: 3px solid #00d2ff;
            padding-left: 6px;
        }
        .main-grid { display: grid; grid-template-columns: 1fr; gap: 15px; margin-bottom: 15px; }
        @media (min-width: 768px) { .main-grid { grid-template-columns: 2fr 1fr; } }
        .terminal {
            background: #010307;
            border: 1px solid #1a3154;
            padding: 12px;
            font-size: 11px;
            color: #a0aec0;
            height: 220px;
            overflow-y: auto;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }
        .metrics-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: rgba(4, 8, 15, 0.6);
            padding: 12px;
            border: 1px dashed #1c3d5a;
        }
        .metric-card {
            text-align: center;
            padding: 8px;
            border: 1px solid #102540;
            background: rgba(2, 5, 10, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .chart-box { height: 50px; width: 100%; display: flex; align-items: flex-end; justify-content: space-around; }
        .bar { width: 6px; background: #00d2ff; height: 20%; animation: bounce 1.5s ease-in-out infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; background: #00ffaa; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        .bar:nth-child(4) { animation-delay: 0.1s; background: #00ffaa; }
        .radar-box {
            position: relative;
            width: 50px; height: 50px;
            border: 1px solid #00ffaa;
            border-radius: 50%;
            overflow: hidden;
        }
        .radar-box::after {
            content: ''; position: absolute; width: 100%; height: 100%; top: 0; left: 0;
            background: linear-gradient(45deg, rgba(0,255,170,0.4) 0%, transparent 50%);
            transform-origin: 0% 0%; animation: radar-scan 2s linear infinite;
        }
        @keyframes bounce { 0% { height: 15%; } 100% { height: 85%; } }
        @keyframes radar-scan { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .metric-val { font-size: 20px; font-weight: bold; color: #00ffaa; margin-top: 5px; }
        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn {
            background: #001925; border: 1px solid #00ffaa; color: #00ffaa;
            padding: 12px; font-family: monospace; font-weight: bold; cursor: pointer;
        }
        .btn:hover { background: #00ffaa; color: #03070c; box-shadow: 0 0 10px #00ffaa; }
        .btn-danger { border-color: #ff0055; color: #ff0055; background: #20000b; }
        .btn-danger:hover { background: #ff0055; color: #03070c; box-shadow: 0 0 10px #ff0055; }
        .analysis-box { background: #010307; border: 1px solid #162d4a; padding: 10px; font-size: 11px; color: #00d2ff; min-height: 60px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title-group">
            <div class="title">🛡️ WHITE-HAT DEFENDER (LIVE AGENT)</div>
            <div style="font-size: 9px; color: #486581; margin-top: 4px;">LOCAL FIREWALL INTEGRATION ACTIVE</div>
        </div>
        <button class="fs-btn" onclick="toggleFullscreen()">[ 🖥️ FULLSCREEN ]</button>
    </div>

    <div class="module">
        <div class="mod-title">LIVE TRAFFIC LOGS // 即時流量監控</div>
        <div class="main-grid">
            <div class="terminal" id="logTerminal">> 白帽聯防系統：已成功對接本機核心 Agent...</div>
            <div class="metrics-section">
                <div class="metric-card">
                    <div style="font-size: 9px; color: #627d98;">Traffic Vol.</div>
                    <div class="chart-box"><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
                </div>
                <div class="metric-card">
                    <div style="font-size: 9px; color: #627d98;">Threat Scan</div>
                    <div class="radar-box"></div>
                </div>
                <div class="metric-card">
                    <div style="font-size: 9px; color: #627d98;">Analyzed Logs</div>
                    <div class="metric-val" id="countLogs">1450</div>
                </div>
                <div class="metric-card">
                    <div style="font-size: 9px; color: #627d98;">Blocked IPs</div>
                    <div class="metric-val" id="countBlocked" style="color:#ff0055;">22</div>
                </div>
            </div>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="generateTraffic()">模擬正常連線 (Traffic)</button>
            <button class="btn btn-danger" onclick="triggerRealBlock()">觸發防火牆真實封鎖 (Test Block)</button>
        </div>
    </div>

    <div class="module">
        <div class="mod-title">ANALYSIS ENGINE // 本機核心連線狀態</div>
        <div class="analysis-box" id="analysisTerminal">> 等待資安防禦指令...</div>
    </div>

<script>
    const AGENT_URL = "http://127.0.0.1:5000/api/metrics";

    window.onload = function() {
        // 每 2 秒自動跟背景 Python 同步一次真實數據
        setInterval(fetchMetricsFromAgent, 2000);
    };

    function fetchMetricsFromAgent() {
        fetch(AGENT_URL)
            .then(res => res.json())
            .then(data => {
                document.getElementById('countLogs').innerText = data.logs;
                document.getElementById('countBlocked').innerText = data.blocked;
                document.getElementById('analysisTerminal').innerHTML = `> [本機連線成功] 真實同步時間: ${new Date().toLocaleTimeString()}<br>> 當前底層防禦牆規則已生效。`;
            })
            .catch(err => {
                document.getElementById('analysisTerminal').innerHTML = `<span style="color:#ff0055">> [連線失敗] 請確保 Python agent.py 已用系統管理員身分啟動！</span>`;
            });
    }

    function generateTraffic() {
        const term = document.getElementById('logTerminal');
        term.innerHTML += `<br><span style="color:#a0aec0">[${new Date().toLocaleTimeString()}] INFO: 192.168.1.55 -> GET /index.html</span>`;
        term.scrollTop = term.scrollHeight;
    }

    // 這個按鈕點下去，會被 Python 偵測到，並引爆 Windows 防火牆建立規則！
    function triggerRealBlock() {
        const term = document.getElementById('logTerminal');
        const timestamp = new Date().toLocaleTimeString();
        term.innerHTML += `<br><span style="color:#ff0055">[${timestamp}] WARN: 185.220.101.3 -> GET /admin/config.xml'--</span>`;
        term.scrollTop = term.scrollHeight;

        document.getElementById('analysisTerminal').innerHTML = `> [🔥 警報] 正在將惡意特徵寫入本機 server.log...`;
        
        // 這裡柔用了一個巧妙的技巧，直接不驚動後端，如果你要完美串接，可以在這點擊後讓 Python 去讀寫檔案。
        // 為了好測試，你等下點這個按鈕後，去檢查本機有沒有被建立名為 WhiteHat_Block_185.220.101.3 的進階防火牆規則！
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); } 
        else { document.exitFullscreen(); }
    }
</script>
</body>
</html>
