<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHITE HAT // DEFENDER CORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Courier New', Courier, monospace, 'PingFang TC';
            background-color: #050b14;
            color: #00ffaa;
            padding: 15px;
            overflow-x: hidden;
        }
        .header {
            border: 1px solid #00d2ff;
            background: rgba(0, 20, 35, 0.6);
            padding: 12px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #00d2ff;
            letter-spacing: 2px;
        }
        .module {
            background: rgba(10, 20, 36, 0.7);
            border: 1px solid #162d4a;
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .mod-title {
            font-size: 12px;
            color: #829ab1;
            margin-bottom: 10px;
            font-weight: bold;
            border-bottom: 1px dashed #162d4a;
            padding-bottom: 4px;
        }
        /* 終端機日誌輸出 */
        .terminal {
            background: #02050a;
            border: 1px solid #1a3154;
            padding: 10px;
            font-size: 11px;
            color: #a0aec0;
            height: 180px;
            overflow-y: auto;
            margin-bottom: 10px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }
        .btn {
            background: #002b3d;
            border: 1px solid #00ffaa;
            color: #00ffaa;
            padding: 10px;
            width: 100%;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }
        .btn:hover {
            background: #00ffaa;
            color: #050b14;
            box-shadow: 0 0 12px #00ffaa;
        }
        .btn-danger {
            border-color: #ff0055;
            color: #ff0055;
            background: #2b0011;
        }
        .btn-danger:hover {
            background: #ff0055;
            color: #050b14;
            box-shadow: 0 0 12px #ff0055;
        }
        .badge {
            background: #ff0055;
            color: white;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 10px;
            float: right;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">🛡️ WHITE-HAT DEFENDER</div>
        <div style="font-size: 9px; color: #486581; margin-top: 4px;">SECURE LOG ANALYSIS ENGINE</div>
    </div>

    <!-- 模塊 1：即時流量日誌 -->
    <div class="module">
        <div class="mod-title">LIVE TRAFFIC LOGS // 即時流量分析</div>
        <div class="terminal" id="logTerminal">> 白帽防禦核心已啟動，監聽中...</div>
        <button class="btn" onclick="generateTraffic()">模擬正常連線流入 (Simulate Traffic)</button>
        <button class="btn btn-danger" onclick="generateAttack()">模擬惡意攻擊注入 (Simulate Attack)</button>
    </div>

    <!-- 模塊 2：白帽偵測引擎與防禦機制 -->
    <div class="module">
        <div class="mod-title">ANALYSIS ENGINE // 分析與本機存檔</div>
        <button class="btn" style="border-color: #00d2ff; color: #00d2ff; background: #001f33;" onclick="analyzeAndBlock()">執行白帽分析與封鎖 (Analyze & Block)</button>
        <div class="terminal" id="analysisTerminal" style="height: 100px; color: #00d2ff;">> 等待分析指令...</div>
    </div>

<script>
    // 模擬的日誌資料庫
    let trafficLogs = [];

    // 模擬正常流量
    function generateTraffic() {
        const ips = ['192.168.1.50', '114.34.20.11', '210.61.12.45'];
        const paths = ['/index.html', '/api/v1/products', '/about.html'];
        const randomIp = ips[Math.floor(Math.random() * ips.length)];
        const randomPath = paths[Math.floor(Math.random() * paths.length)];
        
        const logEntry = { ip: randomIp, request: `GET ${randomPath}`, time: new Date().toLocaleTimeString() };
        trafficLogs.push(logEntry);
        
        const term = document.getElementById('logTerminal');
        term.innerHTML += `<br><span style="color:#a0aec0">[${logEntry.time}] INFO: ${logEntry.ip} -> ${logEntry.request}</span>`;
        term.scrollTop = term.scrollHeight;
    }

    // 模擬惡意突防流量 (包含 SQL 注入特徵)
    function generateAttack() {
        const attackIps = ['45.123.44.5', '185.220.101.3'];
        const maliciousRequests = [
            "GET /login.php?user=admin'--", 
            "POST /api/user/search?id=1%20OR%201=1",
            "GET /admin/config.xml"
        ];
        const randomIp = attackIps[Math.floor(Math.random() * attackIps.length)];
        const randomAttack = maliciousRequests[Math.floor(Math.random() * maliciousRequests.length)];
        
        const logEntry = { ip: randomIp, request: randomAttack, time: new Date().toLocaleTimeString() };
        trafficLogs.push(logEntry);
        
        const term = document.getElementById('logTerminal');
        term.innerHTML += `<br><span style="color:#ff0055">[${logEntry.time}] WARN: ${logEntry.ip} -> ${logEntry.request}</span>`;
        term.scrollTop = term.scrollHeight;
    }

    // 白帽防禦核心演算法：分析並過濾
    function analyzeAndBlock() {
        const analysisTerm = document.getElementById('analysisTerminal');
        if (trafficLogs.length === 0) {
            analysisTerm.innerHTML = `> [系統] 目前沒有流量數據可供分析。`;
            return;
        }

        analysisTerm.innerHTML = `> [分析中] 正在掃描惡意特徵與注入點...`;
        let blockedIps = [];

        // 規則 1：檢查關鍵字特徵 (SQL Injection防禦)
        trafficLogs.forEach(log => {
            if (log.request.includes("'--") || log.request.includes("1=1") || log.request.includes("/admin")) {
                if (!blockedIps.includes(log.ip)) {
                    blockedIps.push(log.ip);
                }
            }
        });

        const timestamp = new Date().toLocaleString();
        if (blockedIps.length > 0) {
            analysisTerm.innerHTML = `> [${timestamp}] 掃描完成！<br>`;
            blockedIps.forEach(ip => {
                analysisTerm.innerHTML += `<span style="color:#ff0055">> 🛑 已成功封鎖惡意 IP: ${ip}</span><br>`;
            });
            
            // 將防禦結果透過 Local Storage 寫入防火牆規則紀錄，實現持久化存檔
            localStorage.setItem('whitehat_fw_rules', JSON.stringify({ blocked: blockedIps, updated: timestamp }));
            analysisTerm.innerHTML += `<span style="color:#00ffaa">> [LocalStorage] 規則已同步至本機防火牆。</span>`;
        } else {
            analysisTerm.innerHTML = `> [${timestamp}] 掃描完成：未偵測到明確惡意特徵。流量安全。`;
        }
        
        // 分析完後清空暫存
        trafficLogs = [];
    }

    // 網頁載入時自動讀取上一次的防火牆規則
    window.onload = function() {
        const savedRules = localStorage.getItem('whitehat_fw_rules');
        if (savedRules) {
            const data = JSON.parse(savedRules);
            document.getElementById('analysisTerminal').innerHTML = `> [系統載入] 已載入上次的防禦規則 (${data.updated})<br>> 目前在封鎖名單中的 IP: ${data.blocked.join(', ')}`;
        }
    };
</script>
</body>
</html>
