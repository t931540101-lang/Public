<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑創 e-GO | HR 人事管理系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col md:flex-row">

    <!-- 側邊導覽列 (Mobile 頂部 / Desktop 側邊) -->
    <aside class="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 flex flex-col justify-between p-4">
        <div>
            <div class="flex items-center gap-3 mb-8 px-2 pt-2">
                <div class="w-8 h-8 bg-emerald-500 rounded-lg flex items-center justify-center text-white font-bold text-lg">黑</div>
                <div>
                    <h1 class="text-white font-bold tracking-wide">黑創 e-GO</h1>
                    <p class="text-xs text-slate-400">HR 人事管理系統 v1.0</p>
                </div>
            </div>

            <!-- 選單按鈕 -->
            <nav class="space-y-1">
                <button onclick="switchView('dashboard')" id="nav-dashboard" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium bg-emerald-600 text-white transition">
                    📊 總覽儀表板
                </button>
                <button onclick="switchView('employees')" id="nav-employees" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    👥 員工檔案管理
                </button>
                <button onclick="switchView('attendance')" id="nav-attendance" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    ⏰ 出勤與打卡紀錄
                </button>
                <button onclick="switchView('leaves')" id="nav-leaves" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 hover:text-white transition">
                    📝 請假簽核管理
                </button>
            </nav>
        </div>

        <!-- 底部系統動作 -->
        <div class="pt-4 border-t border-slate-800 space-y-2">
            <button onclick="exportData()" class="w-full text-left text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded transition">
                📥 匯出資料庫 (JSON)
            </button>
            <button onclick="importData()" class="w-full text-left text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded transition">
                📤 匯入資料庫 (JSON)
            </button>
        </div>
    </aside>

    <!-- 主要內容區 -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto h-screen">

        <!-- 視圖 1: 總覽儀表板 -->
        <section id="view-dashboard" class="view-panel space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">人事總覽 📊</h2>

            <!-- 數據卡片區 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-400">總員工人數</p>
                    <p class="text-3xl font-extrabold text-slate-800 mt-2" id="dash-total-emp">0</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-400">今日出勤率</p>
                    <p class="text-3xl font-extrabold text-emerald-600 mt-2">98%</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-400">待簽核請假</p>
                    <p class="text-3xl font-extrabold text-amber-500 mt-2">2 件</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-400">本月預算/薪資支出</p>
                    <p class="text-3xl font-extrabold text-slate-800 mt-2">NT$ --</p>
                </div>
            </div>

            <!-- 快捷紀錄 / 近期動態 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                <h3 class="font-bold text-slate-700 mb-4">近期考勤動態</h3>
                <div class="text-sm text-slate-500 space-y-3">
                    <div class="flex justify-between py-2 border-b border-slate-100">
                        <span>張小明完成打卡（上班 08:00）</span>
                        <span class="text-xs text-slate-400">今天 08:00</span>
                    </div>
                    <div class="flex justify-between py-2 border-b border-slate-100">
                        <span>李大華提出了「事假」申請</span>
                        <span class="text-xs text-slate-400">昨天 16:30</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 視圖 2: 員工檔案管理 -->
        <section id="view-employees" class="view-panel hidden space-y-6">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold text-slate-800">員工檔案管理 👥</h2>
                <button onclick="openModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm px-4 py-2 rounded-lg font-medium shadow transition">
                    + 新增員工
                </button>
            </div>

            <!-- 員工列表表格 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 text-slate-500 text-xs font-semibold uppercase border-b border-slate-200">
                        <tr>
                            <th class="p-4">工號</th>
                            <th class="p-4">姓名</th>
                            <th class="p-4">部門</th>
                            <th class="p-4">職稱</th>
                            <th class="p-4">電話</th>
                            <th class="p-4">狀態</th>
                            <th class="p-4 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- 動態注入欄位 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 視圖 3: 出勤紀錄 (預留) -->
        <section id="view-attendance" class="view-panel hidden space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">出勤與打卡紀錄 ⏰</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-slate-500">
                出勤打卡數據與月度考勤統計模組準備中...
            </div>
        </section>

        <!-- 視圖 4: 請假簽核 (預留) -->
        <section id="view-leaves" class="view-panel hidden space-y-6">
            <h2 class="text-2xl font-bold text-slate-800">請假簽核管理 📝</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-slate-500">
                線上請假簽核與特休計算模組準備中...
            </div>
        </section>

    </main>

    <!-- 新增/編輯員工 Modal 彈窗 -->
    <div id="emp-modal" class="fixed inset-0 bg-slate-900/50 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-xl w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800" id="modal-title">新增員工資料</h3>
            <form onsubmit="saveEmployee(event)" class="space-y-4">
                <input type="hidden" id="emp-id">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">工號</label>
                        <input type="text" id="emp-code" required class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">姓名</label>
                        <input type="text" id="emp-name" required class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">部門</label>
                        <input type="text" id="emp-dept" placeholder="如：管理部、勤務組" class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-600 mb-1">職稱</label>
                        <input type="text" id="emp-title" placeholder="如：專案經理、組長" class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-600 mb-1">聯絡電話</label>
                    <input type="tel" id="emp-phone" class="w-full p-2 border border-slate-200 rounded-lg text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-600 text-sm rounded-lg">取消</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 text-white text-sm rounded-lg font-medium">儲存</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const DB_KEY = 'obsidian_hr_employees';
        let employees = JSON.parse(localStorage.getItem(DB_KEY)) || [
            { id: '1', code: 'EMP001', name: '張小明', dept: '勤務組', title: '現場組長', phone: '0912-345678', status: '在職' },
            { id: '2', code: 'EMP002', name: '李大華', dept: '管理部', title: '行政專員', phone: '0988-765432', status: '在職' }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            renderEmployees();
        });

        // 頁面視圖切換
        function switchView(viewName) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${viewName}`).classList.remove('hidden');

            document.querySelectorAll('nav button').forEach(btn => {
                btn.classList.remove('bg-emerald-600', 'text-white');
                btn.classList.add('hover:bg-slate-800', 'hover:text-white');
            });

            const activeBtn = document.getElementById(`nav-${viewName}`);
            activeBtn.classList.add('bg-emerald-600', 'text-white');
            activeBtn.classList.remove('hover:bg-slate-800');
        }

        // 渲染員工列表
        function renderEmployees() {
            const tbody = document.getElementById('employee-table-body');
            tbody.innerHTML = '';
            document.getElementById('dash-total-emp').innerText = employees.length;

            employees.forEach(emp => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';
                tr.innerHTML = `
                    <td class="p-4 font-mono font-medium text-slate-700">${emp.code}</td>
                    <td class="p-4 font-bold text-slate-800">${emp.name}</td>
                    <td class="p-4 text-slate-600">${emp.dept}</td>
                    <td class="p-4 text-slate-600">${emp.title}</td>
                    <td class="p-4 text-slate-600">${emp.phone}</td>
                    <td class="p-4"><span class="bg-emerald-100 text-emerald-700 text-xs px-2 py-1 rounded-full font-medium">${emp.status || '在職'}</span></td>
                    <td class="p-4 text-right">
                        <button onclick="deleteEmployee('${emp.id}')" class="text-xs text-rose-500 hover:underline">刪除</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 開啟 Modal
        function openModal() {
            document.getElementById('emp-id').value = '';
            document.getElementById('emp-code').value = 'EMP' + String(employees.length + 1).padStart(3, '0');
            document.getElementById('emp-name').value = '';
            document.getElementById('emp-dept').value = '';
            document.getElementById('emp-title').value = '';
            document.getElementById('emp-phone').value = '';
            document.getElementById('emp-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('emp-modal').classList.add('hidden');
        }

        // 儲存員工
        function saveEmployee(e) {
            e.preventDefault();
            const newEmp = {
                id: Date.now().toString(),
                code: document.getElementById('emp-code').value,
                name: document.getElementById('emp-name').value,
                dept: document.getElementById('emp-dept').value,
                title: document.getElementById('emp-title').value,
                phone: document.getElementById('emp-phone').value,
                status: '在職'
            };
            employees.push(newEmp);
            localStorage.setItem(DB_KEY, JSON.stringify(employees));
            renderEmployees();
            closeModal();
        }

        function deleteEmployee(id) {
            if(confirm('確定要刪除該員工嗎？')) {
                employees = employees.filter(e => e.id !== id);
                localStorage.setItem(DB_KEY, JSON.stringify(employees));
                renderEmployees();
            }
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(employees, null, 2));
            const anchor = document.createElement('a');
            anchor.setAttribute("href", dataStr);
            anchor.setAttribute("download", `hr_employees_${new Date().toISOString().slice(0,10)}.json`);
            anchor.click();
        }

        function importData() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.readAsText(file, 'UTF-8');
                reader.onload = readerEvent => {
                    employees = JSON.parse(readerEvent.target.result);
                    localStorage.setItem(DB_KEY, JSON.stringify(employees));
                    renderEmployees();
                }
            }
            input.click();
        }
    </script>
</body>
</html>
