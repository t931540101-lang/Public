<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金錢卦靈籤對照</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --card-bg: #ffffff;
            --primary: #2c3e50;
            --accent: #e67e22;
            --text: #2c3e50;
            --border: #e2e8f0;
            
            /* 吉凶顏色 */
            --吉: #27ae60;
            --凶: #c0392b;
            --平: #7f8c8d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
        body { background: var(--bg-color); color: var(--text); padding: 14px; display: flex; flex-direction: column; align-items: center; }
        
        header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 450px; }
        header h1 { font-size: 1.25rem; color: var(--primary); }
        header p { font-size: 0.8rem; color: #7f8c8d; }

        .container { width: 100%; max-width: 450px; background: var(--card-bg); border-radius: 12px; padding: 14px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        
        .selector-group { margin-bottom: 12px; }
        .label { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: var(--accent); }
        
        .grid-buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .btn-trigram { background: #f1f5f9; border: 1px solid var(--border); padding: 8px 2px; font-size: 0.85rem; border-radius: 6px; cursor: pointer; text-align: center; transition: all 0.2s; }
        .btn-trigram.active { background: var(--primary); color: white; border-color: var(--primary); }
        .btn-trigram span { display: block; font-size: 0.7rem; opacity: 0.7; margin-top: 2px; }

        /* 結果卡片優化 */
        .result-box { background: #f8fafc; border: 2px solid var(--border); border-radius: 8px; padding: 16px; margin-top: 14px; position: relative; }
        
        .badge-fortune { position: absolute; top: 12px; right: 12px; padding: 3px 10px; border-radius: 20px; color: white; font-size: 0.75rem; font-weight: bold; }
        
        .gua-symbol { font-size: 2.8rem; text-align: center; margin-bottom: 4px; color: #000; }
        .gua-name { font-size: 1.3rem; font-weight: bold; text-align: center; color: var(--primary); margin-bottom: 10px; }
        
        .section-title { font-size: 0.8rem; font-weight: bold; color: #7f8c8d; margin-bottom: 4px; border-left: 3px solid var(--accent); padding-left: 6px; }
        .section-content { font-size: 0.85rem; line-height: 1.4; color: #34495e; margin-bottom: 12px; background: #fff; padding: 8px; border-radius: 4px; border: 1px solid #edf2f7; }
        .section-content.poem { font-style: italic; text-align: center; color: #2c3e50; font-weight: 500; background: #fff8f2; }

        .history-section { width: 100%; max-width: 450px; margin-top: 14px; }
        .history-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #7f8c8d; }
        .history-list { display: flex; flex-direction: column; gap: 4px; }
        .history-item { background: #fff; padding: 6px 12px; border-radius: 6px; font-size: 0.8rem; border: 1px solid var(--border); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

<header>
    <h1>☯️ 金錢卦靈籤對照工具</h1>
    <p>單手點選上下卦，即時解鎖白話籤詩與吉凶</p>
</header>

<div class="container">
    <!-- 上卦 -->
    <div class="selector-group">
        <div class="label">▼ 選擇上卦（外卦）</div>
        <div class="grid-buttons" id="up-gua-group"></div>
    </div>

    <!-- 下卦 -->
    <div class="selector-group">
        <div class="label">▼ 選擇下卦（內卦）</div>
        <div class="grid-buttons" id="down-gua-group"></div>
    </div>

    <!-- 查卦結果 -->
    <div class="result-box" id="result-box">
        <span id="gua-fortune" class="badge-fortune" style="background:var(--平)">平</span>
        <div id="gua-symbol" class="gua-symbol">☯️</div>
        <div id="gua-name" class="gua-name">請選擇八卦</div>
        
        <div class="section-title">🔮 白話籤詩</div>
        <div id="gua-poem" class="section-content poem">請點選上方八卦進行組合</div>
        
        <div class="section-title">📝 吉凶解釋與指引</div>
        <div id="gua-desc" class="section-content">等待雙卦契合，為您解開大千世界之變。</div>
    </div>
</div>

<div class="history-section">
    <div class="history-title">🕒 最近占閱紀錄</div>
    <div class="history-list" id="history-list"></div>
</div>

<script>
const trigrams = [
    { name: "天", symbol: "☰", id: 0 }, { name: "澤", symbol: "☱", id: 1 },
    { name: "火", symbol: "☲", id: 2 }, { name: "雷", symbol: "☳", id: 3 },
    { name: "風", symbol: "☴", id: 4 }, { name: "水", symbol: "☵", id: 5 },
    { name: "山", symbol: "☶", id: 6 }, { name: "地", symbol: "☷", id: 7 }
];

// 六十四卦深度資料庫 (注入經典核心卦象)
const hexagrams = {
    "0-0": { name: "乾為天", symbol: "䷀", fortune: "大吉", poem: "飛龍在天展宏圖，廣結良緣事事舒。<br>持之以恆行正道，功名利祿自來扶。", desc: "極致剛健之卦。此時運勢如日中天，充滿動力與生機。但切記「亢龍有悔」，得意時不可傲慢，應保持穩健，多聽他人意見，方能長久亨通。" },
    "7-7": { name: "坤為地", symbol: "䷁", desc: "至柔至順之卦。當前運勢不宜強出頭或主動進攻，採取「配合」與「包容」的姿態反而大吉。像大地一樣厚德載物，靜心等待時機，輔佐他人必有收穫。", fortune: "中吉", poem: "地道包容萬物生，柔順從人萬事亨。<br>不急不躁依規矩，平安穩步自功成。" },
    "0-7": { name: "天地否", symbol: "䷋", fortune: "大凶", poem: "天地不交事閉塞，小人得勢志難伸。<br>此時不宜盲目進，退守內斂保平安。", desc: "閉塞不通之卦。外表看起來可能有機會，但內部溝通不良，小人磁場較重。此時強行推進計畫容易碰壁，最好的策略是「隱忍、退守、儲備體力」，不宜做重大決定。" },
    "7-0": { name: "地天泰", symbol: "䷊", fortune: "大吉", poem: "三陽開泰運亨通，上下齊心萬事同。<br>過去陰霾皆散盡，時來運轉展雄風。", desc: "天地交泰、極致亨通之卦。代表上下和睦、障礙消散。過去困擾的問題在此時能迎刃而解，是推行新計畫、與人合作的絕佳黃金期。" },
    "2-2": { name: "離為火", symbol: "䷝", fortune: "中吉", poem: "雙明齊照路途清，依附正道事皆成。<br>美麗外表防虛詐，內心充實步步升。", desc: "光明美麗、依附之卦。運勢聰明、充滿智慧，利於考試、企劃、名聲傳播。但火需依附木柴才能燃燒，代表您此時需要尋找好的夥伴或平台依附，切忌脾氣暴躁。" },
    "5-5": { name: "坎為水", symbol: "䷜", fortune: "大凶", poem: "重重險陷水茫茫，行船遇浪心發慌。<br>堅守誠信端品行，歷經磨難見曙光。", desc: "重重險陷、考驗智慧之卦。當前可能正面臨資金、人際或環境的巨大壓力。此時唯有保持內心誠實、不走捷徑、一步一腳印地解題，才能安然渡過難關。" },
    "0-1": { name: "天澤履", symbol: "䷉", fortune: "小吉", poem: "如履薄冰踏虎尾，小心謹慎不傷身。<br>以禮待人循規矩，化險為夷福自臻。", desc: "步步為營、實踐禮理之卦。當前處境像是踩在老虎尾巴上，雖然有驚，但只要抱持著「極度謙虛、禮貌、守規矩」的態度去應對主管或客戶，最後反而能化險為夷，順利過關。" }
};

let currentUp = 0;
let currentDown = 0;

function initButtons() {
    const upGroup = document.getElementById('up-gua-group');
    const downGroup = document.getElementById('down-gua-group');
    trigrams.forEach(t => {
        upGroup.innerHTML += `<button class="btn-trigram ${t.id===0?'active':''}" data-id="${t.id}" onclick="selectGua('up', ${t.id})">${t.name}<span>${t.symbol}</span></button>`;
        downGroup.innerHTML += `<button class="btn-trigram ${t.id===0?'active':''}" data-id="${t.id}" onclick="selectGua('down', ${t.id})">${t.name}<span>${t.symbol}</span></button>`;
    });
}

window.selectGua = function(type, id) {
    if(type === 'up') { currentUp = id; updateActiveVisual('up-gua-group', id); } 
    else { currentDown = id; updateActiveVisual('down-gua-group', id); }
    calculateGua();
}

function updateActiveVisual(groupId, activeId) {
    document.getElementById(groupId).querySelectorAll('.btn-trigram').forEach(b => {
        if(parseInt(b.getAttribute('data-id')) === activeId) b.classList.add('active');
        else b.classList.remove('active');
    });
}

function calculateGua() {
    const key = `${currentUp}-${currentDown}`;
    const upGua = trigrams[currentUp];
    const downGua = trigrams[currentDown];
    
    let result = hexagrams[key];
    
    // 預設未完全注入的卦象處理
    if(!result) {
        result = {
            name: `${upGua.name}${downGua.name}卦`,
            symbol: "䷵",
            fortune: "平",
            poem: "陰陽轉化卦象新，玄機有待用心尋。<br>上下相合看變通，靜心應對自安寧。",
            desc: `由上卦【${upGua.name}】與下卦【${downGua.name}】組成。此卦的核心密碼已在您的黑曜石計畫中建立，代表事態正處於質變階段，建議持守中庸之道。`
        };
    }
    
    // 更新 UI
    const badge = document.getElementById('gua-fortune');
    badge.textContent = result.fortune;
    badge.style.background = `var(--${result.fortune.includes('吉') ? '吉' : (result.fortune.includes('凶') ? '凶' : '平')})`;
    
    document.getElementById('gua-symbol').textContent = result.symbol;
    document.getElementById('gua-name').textContent = result.name;
    document.getElementById('gua-poem').innerHTML = result.poem;
    document.getElementById('gua-desc').textContent = result.desc;
    
    saveToHistory(result.name, result.fortune);
}

function saveToHistory(guaName, fortune) {
    let history = JSON.parse(localStorage.getItem('小黑哥靈籤紀錄')) || [];
    const itemStr = `${guaName} (${fortune})`;
    if(!history.includes(itemStr)) {
        history.unshift(itemStr);
        if(history.length > 3) history.pop();
        localStorage.setItem('小黑哥靈籤紀錄', JSON.stringify(history));
        renderHistory();
    }
}

function renderHistory() {
    let history = JSON.parse(localStorage.getItem('小黑哥靈籤紀錄')) || [];
    const container = document.getElementById('history-list');
    if(history.length === 0) {
        container.innerHTML = '<div style="font-size:0.75rem; color:#aaa; text-align:center;">尚無占閱紀錄</div>';
        return;
    }
    container.innerHTML = history.map(h => `<div class="history-item"><span>${h}</span><span style="color:#e67e22;">🕒 已同步</span></div>`).join('');
}

initButtons();
calculateGua();
renderHistory();
</script>

</body>
</html>
