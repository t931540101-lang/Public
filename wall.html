<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小黑哥的私密好友社群牆</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --text-secondary: #888888;
            --accent-color: #4CAF50;
            --accent-hover: #45a049;
            --border-color: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* 手機窄螢幕容器 */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        @media (min-width: 428px) {
            .mobile-container {
                height: 90vh;
            }
        }

        /* 頂部導覽列 */
        header {
            padding: 16px;
            background-color: #181818;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #ffffff;
        }

        /* 內容捲動區 */
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        /* 密碼解鎖畫面 */
        #auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            text-align: center;
            padding: 20px;
        }

        #auth-screen input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #2c2c2c;
            color: white;
            font-size: 16px;
        }

        /* 發文區塊 */
        .post-box {
            background-color: #252525;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .post-box textarea {
            width: 100%;
            height: 80px;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px;
            color: white;
            resize: none;
            font-size: 14px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .post-btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
        }

        /* 貼文卡片 */
        .card {
            background-color: #252525;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .card-header {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .card-body {
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 12px;
            word-break: break-all;
        }

        /* 互動按鈕區 (讚與留言數) */
        .card-actions {
            display: flex;
            gap: 16px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .action-item {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }

        .action-item:hover {
            color: var(--accent-color);
        }

        /* 留言清單區 */
        .comments-section {
            margin-top: 8px;
            border-top: 1px dashed var(--border-color);
            padding-top: 8px;
            display: none; /* 預設收合，點擊留言展開 */
        }

        .comment-item {
            font-size: 13px;
            margin-bottom: 6px;
            background-color: #1e1e1e;
            padding: 6px 10px;
            border-radius: 6px;
        }

        .comment-item span {
            font-weight: bold;
            color: var(--accent-color);
            margin-right: 6px;
        }

        .comment-input-box {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .comment-input-box input {
            flex: 1;
            padding: 6px;
            background-color: #1e1e1e;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <header>小黑哥的私密互動牆</header>

        <!-- 密碼驗證畫面 -->
        <div id="auth-screen">
            <h3>🔒 私密空間請輸入通行密碼</h3>
            <p style="font-size: 13px; color: #888; margin-top: 4px;">預設密碼為：1234</p>
            <input type="password" id="passcode-input" placeholder="請輸入通行密碼">
            <button class="btn" onclick="checkPasscode()">進入牆面</button>
        </div>

        <!-- 主內容畫面 (預設隱藏，驗證通過後顯示) -->
        <div id="main-app" class="content-area" style="display: none;">
            
            <!-- 發文輸入框 -->
            <div class="post-box">
                <textarea id="post-content" placeholder="隨手記錄生活或技術筆記..."></textarea>
                <div class="post-btn-container">
                    <button class="btn" onclick="createPost()">發布動態</button>
                </div>
            </div>

            <!-- 動態牆列表 -->
            <div id="posts-container">
                <!-- 動態由 JavaScript 動態生成 -->
            </div>
        </div>
    </div>

    <script>
        // 預設密碼
        const CORRECT_PASSCODE = "1234";

        function checkPasscode() {
            const inputVal = document.getElementById('passcode-input').value;
            if (inputVal === CORRECT_PASSCODE) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                loadPosts();
            } else {
                alert('密碼錯誤！請輸入正確的通行密碼。');
            }
        }

        // 從 LocalStorage 載入貼文
        function loadPosts() {
            const postsContainer = document.getElementById('posts-container');
            postsContainer.innerHTML = '';
            
            let posts = JSON.parse(localStorage.getItem('black_wall_posts')) || [];

            if (posts.length === 0) {
                postsContainer.innerHTML = '<p style="text-align:center; color:#777; font-size:14px; margin-top:20px;">目前沒有任何動態，發布第一則貼文吧！</p>';
                return;
            }

            posts.forEach((post, index) => {
                let card = document.createElement('div');
                card.className = 'card';
                
                let commentsHtml = '';
                if (post.comments && post.comments.length > 0) {
                    post.comments.forEach(c => {
                        commentsHtml += `<div class="comment-item"><span>${c.name}:</span>${c.text}</div>`;
                    });
                }

                card.innerHTML = `
                    <div class="card-header">${post.time}</div>
                    <div class="card-body">${post.text}</div>
                    <div class="card-actions">
                        <div class="action-item" onclick="likePost(${index})">❤️ 讚 (${post.likes || 0})</div>
                        <div class="action-item" onclick="toggleComments(${index})">💬 留言 (${post.comments ? post.comments.length : 0})</div>
                    </div>
                    <div class="comments-section" id="comments-${index}" style="display: ${post.showComments ? 'block' : 'none'};">
                        <div id="comment-list-${index}">${commentsHtml}</div>
                        <div class="comment-input-box">
                            <input type="text" id="c-name-${index}" placeholder="你的暱稱" style="width: 80px;">
                            <input type="text" id="c-text-${index}" placeholder="留個言吧..." onkeypress="handleKeyPress(event, ${index})">
                            <button class="btn" style="padding: 4px 8px;" onclick="addComment(${index})">送出</button>
                        </div>
                    </div>
                `;
                postsContainer.appendChild(card);
            });
        }

        // 建立新貼文
        function createPost() {
            const contentBox = document.getElementById('post-content');
            const text = contentBox.value.trim();
            if (!text) {
                alert('請輸入貼文內容！');
                return;
            }

            let posts = JSON.parse(localStorage.getItem('black_wall_posts')) || [];
            const now = new Date();
            const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

            posts.unshift({
                text: text,
                time: timeStr,
                likes: 0,
                comments: [],
                showComments: false
            });

            localStorage.setItem('black_wall_posts', JSON.stringify(posts));
            contentBox.value = '';
            loadPosts();
        }

        // 按讚功能
        function likePost(index) {
            let posts = JSON.parse(localStorage.getItem('black_wall_posts')) || [];
            posts[index].likes = (posts[index].likes || 0) + 1;
            localStorage.setItem('black_wall_posts', JSON.stringify(posts));
            loadPosts();
        }

        // 切換留言區顯示
        function toggleComments(index) {
            let posts = JSON.parse(localStorage.getItem('black_wall_posts')) || [];
            posts[index].showComments = !posts[index].showComments;
            localStorage.setItem('black_wall_posts', JSON.stringify(posts));
            loadPosts();
        }

        // 新增留言
        function addComment(index) {
            const nameInput = document.getElementById(`c-name-${index}`);
            const textInput = document.getElementById(`c-text-${index}`);
            
            const name = nameInput.value.trim() || '神秘好友';
            const text = textInput.value.trim();

            if (!text) return;

            let posts = JSON.parse(localStorage.getItem('black_wall_posts')) || [];
            if (!posts[index].comments) posts[index].comments = [];

            posts[index].comments.push({ name: name, text: text });
            localStorage.setItem('black_wall_posts', JSON.stringify(posts));
            loadPosts();
        }

        function handleKeyPress(event, index) {
            if (event.key === 'Enter') {
                addComment(index);
            }
        }
    </script>
</body>
</html>
