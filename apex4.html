<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR Web Service - Obsidian Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #0d1117; /* 黑曜石極致暗黑底色 */
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* 1. 頂部導覽列 */
    header {
      background-color: #161b22;
      height: 48px;
      display: flex;
      align-items: center;
      position: relative;
      color: #fff;
      z-index: 10;
      border-bottom: 1px solid #30363d;
    }

    .logo-icon {
      position: absolute;
      left: 26.5%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #f59e0b;
      font-size: 16px;
    }

    .nav-group {
      position: absolute;
      left: 37%;
      display: flex;
      align-items: center;
    }

    .nav-links {
      display: flex;
      gap: 130px;
      align-items: center;
      margin-right: 25px;
    }

    .nav-links a {
      color: #8b949e;
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-links a:hover {
      color: #f59e0b;
    }

    .nav-links a.active {
      color: #ffffff;
      font-weight: 600;
      border-bottom: 2px solid #f59e0b;
      padding-bottom: 2px;
    }

    .lang-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .lang-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #d97706;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(217, 119, 6, 0.4);
    }

    /* 頁面切換控制 */
    .page-section {
      display: none;
      flex: 1;
      flex-direction: column;
      position: relative;
    }

    .page-section.active {
      display: flex;
    }

    /* 2. 主 Banner 區塊 (客製化星空風格) */
    .hero-banner {
      width: 100%;
      min-height: 280px;
      background: radial-gradient(circle at 75% 50%, #1e293b 0%, #0f172a 60%, #020617 100%);
      margin-top: 15px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-top: 1px solid #1e293b;
      border-bottom: 1px solid #1e293b;
      padding: 30px 20px;
    }

    /* 星空點綴幾何圖案 */
    .star-bg-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #f59e0b, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 150px 180px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 280px 120px, #60a5fa, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 400px 220px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 500px 300px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* 左上角斜卡片裝飾 (改為微光透明深藍卡) */
    .bg-card-left {
      position: absolute;
      left: 35px;
      top: -25px;
      width: 170px;
      height: 220px;
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.01));
      backdrop-filter: blur(4px);
      transform: rotate(-28deg);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      pointer-events: none;
    }

    /* 右側客製化「星芒標誌組件」（替代原本的手機） */
    .star-mockup {
      position: absolute;
      right: 12%;
      bottom: -30px;
      width: 220px;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(15deg);
      pointer-events: none;
    }

    /* 星環結構 */
    .star-ring {
      position: absolute;
      width: 180px;
      height: 180px;
      border: 2px dashed rgba(245, 158, 11, 0.4);
      border-radius: 50%;
      animation: spin 30s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    /* 中央亮星 */
    .main-star {
      font-size: 90px;
      color: #fbbf24;
      text-shadow: 0 0 25px rgba(251, 191, 36, 0.8), 0 0 50px rgba(245, 158, 11, 0.4);
      filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
    }

    /* 首頁標題文字 */
    .hero-text {
      text-align: center;
      z-index: 2;
    }

    .hero-title {
      font-size: 44px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 16px;
      color: #fbbf24;
      font-weight: 400;
      letter-spacing: 2px;
    }

    /* 3. 表單頁面容器 */
    .form-container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      z-index: 2;
      position: relative;
    }

    .btn-record {
      background-color: #d97706;
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      position: absolute;
      left: 0;
      top: 0;
      transition: background-color 0.2s;
    }
    .btn-record:hover { background-color: #b45309; }

    .page-title {
      text-align: center;
      font-size: 26px;
      font-weight: 600;
      color: #ffffff;
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px 40px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 500;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-control {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #334155;
      border-radius: 6px;
      background-color: #0f172a;
      font-size: 14px;
      color: #f8fafc;
      outline: none;
      transition: all 0.2s;
    }

    .form-control:focus {
      border-color: #f59e0b;
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.2);
    }

    .form-control:disabled, .form-control[readonly] {
      background-color: #1e293b;
      color: #64748b;
      border-color: #334155;
    }

    .input-icon {
      position: absolute;
      right: 12px;
      cursor: pointer;
      color: #fbbf24;
      font-size: 14px;
      user-select: none;
    }

    .form-actions {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-top: 30px;
      grid-column: span 2;
    }

    .btn {
      padding: 8px 30px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: background-color 0.2s;
    }

    .btn-query { background-color: #2563eb; color: white; }
    .btn-query:hover { background-color: #1d4ed8; }

    .btn-submit { background-color: #d97706; color: white; width: 100%; height: 38px; }
    .btn-submit:hover { background-color: #b45309; }

    /* 4. Footer 區塊 */
    footer {
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #64748b;
      margin-top: auto;
      position: relative;
      background-color: #0f172a;
      border-top: 1px solid #1e293b;
    }

    .copyright-area {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 210px;
    }

    .toggle-btn {
      position: absolute;
      right: 16px;
      bottom: 12px;
      background-color: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="logo-icon" onclick="switchPage('home')">★</div>

    <div class="nav-group">
      <nav class="nav-links">
        <a id="nav-home" onclick="switchPage('home')" class="active">首頁</a>
        <a id="nav-leave" onclick="switchPage('leave')">請假單</a>
        <a id="nav-punch" onclick="switchPage('punch')">未刷單</a>
      </nav>
      
      <div class="lang-group">
        <div class="lang-badge">TW</div>
        <div class="lang-badge">TH</div>
        <div class="lang-badge">ID</div>
      </div>
    </div>
  </header>

  <!-- ================= 頁面 1：首頁 ================= -->
  <section id="page-home" class="page-section active">
    <div class="hero-banner">
      <div class="star-bg-overlay"></div>
      <div class="bg-card-left"></div>
      
      <div class="hero-text">
        <h1 class="hero-title">HR web service</h1>
        <p class="hero-subtitle">Designed for IT • Obsidian Edition</p>
      </div>

      <!-- 右側星星標誌視覺 -->
      <div class="star-mockup">
        <div class="star-ring"></div>
        <div class="main-star">★</div>
      </div>
    </div>
  </section>

  <!-- ================= 頁面 2：請假單 ================= -->
  <section id="page-leave" class="page-section">
    <div class="hero-banner">
      <div class="star-bg-overlay"></div>
      <div class="bg-card-left"></div>
      <div class="star-mockup">
        <div class="star-ring"></div>
        <div class="main-star">★</div>
      </div>

      <div class="form-container">
        <h2 class="page-title">請假單</h2>
        <form id="leaveForm">
          <div class="form-grid">
            <div class="form-group">
              <label>身分證號後四碼</label>
              <div class="input-wrapper">
                <input type="password" id="leaveIdCard" class="form-control" maxlength="4" value="1234">
                <span class="input-icon" onclick="togglePassword('leaveIdCard')">👁</span>
              </div>
            </div>
            <div class="form-group">
              <label>部門</label>
              <input type="text" class="form-control" readonly value="資訊部">
            </div>
            <div class="form-group">
              <label>工號</label>
              <input type="text" id="leaveEmpId" class="form-control" value="d01762">
            </div>
            <div class="form-group">
              <label>1級主管</label>
              <input type="text" class="form-control" readonly value="林經理">
            </div>
            <div class="form-group">
              <label>姓名</label>
              <input type="text" id="leaveEmpName" class="form-control" value="盧家慶">
            </div>
            <div class="form-group">
              <label>2級主管</label>
              <input type="text" class="form-control" readonly value="王協理">
            </div>
            <div class="form-group">
              <label>請假名稱</label>
              <select id="leaveType" class="form-control">
                <option value="">請選擇...</option>
                <option value="annual">特休假</option>
                <option value="sick">病假</option>
                <option value="personal">事假</option>
              </select>
            </div>
            <div class="form-group">
              <label>未休時數</label>
              <input type="text" class="form-control" readonly value="16.0">
            </div>
            <div class="form-group">
              <label>開始時間</label>
              <input type="datetime-local" class="form-control">
            </div>
            <div class="form-group">
              <label>預計請假時數</label>
              <input type="text" class="form-control" placeholder="自動計算">
            </div>
            <div class="form-group">
              <label>結束時間</label>
              <input type="datetime-local" class="form-control">
            </div>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-query" onclick="alert('已送出查詢條件！')">查詢</button>
            <button type="submit" class="btn btn-submit" style="width: auto;">送出</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- ================= 頁面 3：未刷單 ================= -->
  <section id="page-punch" class="page-section">
    <div class="hero-banner">
      <div class="star-bg-overlay"></div>
      <div class="bg-card-left"></div>
      <div class="star-mockup">
        <div class="star-ring"></div>
        <div class="main-star">★</div>
      </div>

      <div class="form-container">
        <button type="button" class="btn-record">申請記錄</button>
        <h2 class="page-title">未刷單</h2>
        <form id="punchForm">
          <div class="form-grid">
            <div class="form-group">
              <label>工號</label>
              <input type="text" id="punchEmpId" class="form-control" value="d01762">
            </div>
            <div class="form-group">
              <label>身分證號後四碼</label>
              <div class="input-wrapper">
                <input type="password" id="punchIdCard" class="form-control" maxlength="4" placeholder="••••">
                <span class="input-icon" onclick="togglePassword('punchIdCard')">👁</span>
              </div>
            </div>
            <div class="form-group">
              <label>未刷卡原因</label>
              <select id="punchReason" class="form-control">
                <option value="未帶卡" selected>未帶卡</option>
                <option value="忘刷卡">忘刷卡</option>
                <option value="公出">公出</option>
                <option value="卡片感應不良">卡片感應不良</option>
              </select>
            </div>
            <div class="form-group">
              <label>未刷卡時間</label>
              <input type="datetime-local" class="form-control">
            </div>
            <div class="form-group" style="grid-column: span 2; max-width: 300px; margin: 0 auto;">
              <button type="submit" class="btn-submit">送出</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- 底部 Footer -->
  <footer>
    <div class="copyright-area">
      <span>⚙</span>
      <span>© APEX DYNAMICS 2026 • K9 Obsidian</span>
    </div>
    <button class="toggle-btn">Toggle theme ▾</button>
  </footer>

  <script>
    function switchPage(pageName) {
      document.querySelectorAll('.page-section').forEach(section => {
        section.classList.remove('active');
      });
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.remove('active');
      });
      document.getElementById('page-' + pageName).classList.add('active');
      document.getElementById('nav-' + pageName).classList.add('active');
      localStorage.setItem('hr_active_page', pageName);
    }

    function togglePassword(elementId) {
      const input = document.getElementById(elementId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    window.addEventListener('load', () => {
      const savedPage = localStorage.getItem('hr_active_page');
      if (savedPage) {
        switchPage(savedPage);
      }
      const leaveDraft = localStorage.getItem('leave_form_draft');
      if (leaveDraft) {
        const data = JSON.parse(leaveDraft);
        if (data.empId) document.getElementById('leaveEmpId').value = data.empId;
        if (data.empName) document.getElementById('leaveEmpName').value = data.empName;
        if (data.leaveType) document.getElementById('leaveType').value = data.leaveType;
      }
    });

    document.getElementById('leaveForm').addEventListener('input', () => {
      const formData = {
        empId: document.getElementById('leaveEmpId').value,
        empName: document.getElementById('leaveEmpName').value,
        leaveType: document.getElementById('leaveType').value
      };
      localStorage.setItem('leave_form_draft', JSON.stringify(formData));
    });

    document.getElementById('leaveForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('請假單已成功送出！');
    });

    document.getElementById('punchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      alert('未刷單已成功送出！');
    });
  </script>

</body>
</html>
