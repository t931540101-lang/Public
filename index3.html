<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HR web service</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f1f2f4;
      color: #333;
    }

    body {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 頂部導覽列 */
    header {
      background-color: #2b2e33;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      color: #fff;
      z-index: 10;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo-icon {
      width: 22px;
      height: 22px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon::after {
      content: '';
      width: 8px;
      height: 8px;
      border: 2px solid #a0a5ad;
      border-radius: 50%;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #b0b5be;
      text-decoration: none;
      font-size: 14px;
      transition: color 0.2s;
    }

    .nav-links a:hover, .nav-links a.active {
      color: #ffffff;
    }

    .lang-group {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .lang-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background-color: #e65100;
      color: white;
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* 主內容區 */
    main {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 左上角大片幾何淡灰斜塊 */
    .bg-shape-topleft {
      position: absolute;
      top: -60px;
      left: -80px;
      width: 450px;
      height: 300px;
      background-color: #e2e4e8;
      transform: rotate(-25deg);
      border-radius: 12px;
      z-index: 1;
      opacity: 0.8;
    }

    .hero-content {
      text-align: center;
      z-index: 5;
      margin-top: -40px;
    }

    .hero-title {
      font-size: 42px;
      font-weight: 700;
      color: #1a1c1e;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .hero-subtitle {
      font-size: 15px;
      color: #6c757d;
    }

    /* 精準對齊照片的右下角平板/手機 */
    .phone-container {
      position: absolute;
      right: 8%;
      bottom: -40px;
      z-index: 2;
    }

    .phone-mockup {
      width: 260px;
      height: 340px;
      background-color: #2d3135;
      border-radius: 28px 28px 0 0;
      transform: rotate(28deg);
      box-shadow: -10px 15px 30px rgba(0, 0, 0, 0.15);
      padding: 12px 12px 0 12px;
      display: flex;
      flex-direction: column;
    }

    .phone-screen {
      flex: 1;
      background-color: #484e53;
      border-radius: 18px 18px 0 0;
    }

    /* 頁尾與標籤 */
    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .copyright {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8c939d;
      margin-left: 20%;
      margin-bottom: 30px;
    }

    .toggle-btn {
      pointer-events: auto;
      background-color: #4f46e5;
      color: white;
      border: none;
      padding: 7px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header>
    <div class="nav-left">
      <div class="logo-icon"></div>
      <nav class="nav-links">
        <a href="#" class="active">首頁</a>
        <a href="#">請假單</a>
        <a href="#">未刷單</a>
      </nav>
    </div>
    <div class="lang-group">
      <div class="lang-badge">TW</div>
      <div class="lang-badge">TH</div>
      <div class="lang-badge">ID</div>
    </div>
  </header>

  <!-- 主內容區 -->
  <main>
    <div class="bg-shape-topleft"></div>

    <div class="hero-content">
      <h1 class="hero-title">HR web service</h1>
      <p class="hero-subtitle">Designed for IT</p>
    </div>

    <!-- 右下角擺放與傾斜角度完全對齊照片 -->
    <div class="phone-container">
      <div class="phone-mockup">
        <div class="phone-screen"></div>
      </div>
    </div>

    <!-- 頁尾版權與按鈕 -->
    <footer>
      <div class="copyright">
        <span>⚙</span>
        <span>© APEX DYNAMICS 2026</span>
      </div>
      <button class="toggle-btn">Toggle theme ▾</button>
    </footer>
  </main>

</body>
</html>
